<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<title>Kebon Kosong</title>
<script>
  // Pasang tema sebelum halaman digambar supaya tidak berkedip
  (function () {
    let theme = null;
    try { theme = JSON.parse(localStorage.getItem('kebon-kosong-settings')).theme; } catch {}
    if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  :root {
    --bg: #f3efe6;
    --card: #fffdf8;
    --ink: #2a2620;
    --muted: #7a7266;
    --line: #e4ddcf;
    --track: #ebe5d8;
    --wood: #a0673a;
    --on-bg: #3f7d4e;
    --on-ink: #ffffff;
    --on-edge: #2b5a37;
    --level: #2f7fe0;
    --danger: #c0392b;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #141a16;
    --card: #1d2520;
    --ink: #ece7dc;
    --muted: #9a9486;
    --line: #2c3530;
    --track: #2a332d;
    --wood: #c98a55;
    --on-bg: #2f6b3e;
    --on-ink: #eaf5ec;
    --on-edge: #1c4227;
    --level: #5aa2ff;
    --danger: #ff6b5b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .app { max-width: 480px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 16px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .kepeng { margin-left: auto; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
  .menu-btn {
    width: 40px; height: 40px; margin-right: -8px;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 10px;
    color: var(--ink); cursor: pointer;
  }
  .menu-btn:active { background: var(--track); }

  .scrim {
    position: fixed; inset: 0; z-index: 10;
    background: transparent;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .drawer {
    position: fixed; top: 0; bottom: 0; right: 0; z-index: 11;
    width: min(260px, 75vw);
    background: var(--card);
    border-left: 1px solid var(--line);
    padding: max(16px, env(safe-area-inset-top)) 12px 16px;
    transform: translateX(100%);
    visibility: hidden;
    transition: transform .25s ease, visibility .25s;
  }
  body.menu-open .scrim { opacity: 1; pointer-events: auto; }
  body.menu-open .drawer { transform: none; visibility: visible; }
  .drawer .brand { font-weight: 700; padding: 10px 12px 16px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 12px;
    background: none; border: 0; border-radius: 10px;
    font: inherit; font-size: 15px; color: var(--ink); text-align: left;
    cursor: pointer;
  }
  .nav-item:active { background: var(--track); }
  .nav-item[aria-current="page"] { background: var(--track); font-weight: 600; }

  .items { list-style: none; margin: 0; padding: 0 0 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 20px 8px; }
  .item {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 6px 4px 10px;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 12px;
    font: inherit;
    cursor: pointer;
  }
  .item[aria-expanded="true"] { border-color: var(--muted); }
  /* Popup nama item, melayang di atas kotak */
  .tip {
    position: fixed; z-index: 5;
    transform: translate(-50%, -100%);
    padding: 6px 10px;
    background: var(--ink); color: var(--bg);
    border-radius: 8px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
    pointer-events: none;
    animation: tip-in .15s ease-out;
  }
  .tip::after {
    content: ""; position: absolute; left: 50%; top: 100%;
    margin-left: calc(var(--arrow, 0px) - 5px);
    border: 5px solid transparent; border-top-color: var(--ink);
  }
  @keyframes tip-in { from { opacity: 0; transform: translate(-50%, calc(-100% + 4px)); } }
  .item-icon { font-size: 30px; line-height: 1; }
  /* Counter duduk di tengah garis bawah kotak */
  .item-qty {
    position: absolute; left: 50%; bottom: 0;
    transform: translate(-50%, 50%);
    min-width: 28px; padding: 2px 8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 12px; font-weight: 700; line-height: 1.2;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }
  .group { font-size: 12px; font-weight: 600; color: var(--muted); margin: 4px 0 10px; }
  .items + .group { margin-top: 12px; }
  .segment.three { grid-template-columns: repeat(3, 1fr); }
  .sort { margin-bottom: 16px; }
  .tool .fill.full { background: var(--danger); }
  .pop.full { color: var(--danger); }
  .emoji-teak { display: inline-block; filter: brightness(.68) saturate(1.5) hue-rotate(-8deg); }
  .emoji-fish { display: inline-block; }
  .tint { display: inline-block; }
  .tint.mahogany { filter: hue-rotate(-20deg) saturate(1.6) brightness(.8); }
  .tint.ulin { filter: brightness(.45) saturate(.8); }
  .tint.iron { filter: grayscale(.6) brightness(.9); }
  .tint.gold { filter: sepia(1) saturate(3) hue-rotate(5deg) brightness(1.05); }
  .tint.scale { filter: hue-rotate(60deg) saturate(.8); }
  .tint.eel { filter: sepia(.8) brightness(.6); }
  .tint.grouper { filter: sepia(.7) hue-rotate(-20deg) saturate(1.4) brightness(.8); }
  .emoji-fish.carp { filter: sepia(1) saturate(3) hue-rotate(-15deg); }
  .emoji-fish.pangasius { filter: grayscale(.8) brightness(1.1); }
  .emoji-fish.giantSnakehead { filter: hue-rotate(70deg) brightness(.6); }
  .emoji-fish.mackerel { filter: hue-rotate(20deg) saturate(1.4); }
  .emoji-fish.tuna { filter: brightness(.55) saturate(1.3); }
  .emoji-fish.wader { transform: scale(.8); }
  .emoji-fish.tilapia { filter: hue-rotate(150deg) saturate(.7); }
  .emoji-fish.catfish { filter: grayscale(1) brightness(.65); }
  .emoji-fish.snakehead { filter: sepia(1) saturate(2.2) hue-rotate(-25deg) brightness(.75); }

  /* Area terkunci di menu */
  .nav-text { display: flex; flex-direction: column; }
  .nav-lock { font-size: 11px; color: var(--muted); font-weight: 400; }
  .nav-item:disabled { cursor: default; opacity: .6; }
  .nav-item:disabled:active { background: none; }

  /* Node terkunci: tidak bisa diklik, ikon pudar, syarat ditampilkan */
  .card.locked { cursor: default; }
  .card.locked:active { transform: none; }
  .card.locked .icon { filter: grayscale(1); opacity: .35; }
  .card.locked .level { visibility: hidden; }
  .tool-hint { display: block; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .skill { margin-top: 12px; }
  .emoji-cooked { display: inline-block; filter: sepia(.6) saturate(1.4) brightness(.8); }
  .emoji-seed { position: relative; display: inline-block; }
  .seed-of { position: absolute; right: -.25em; bottom: -.15em; font-size: .5em; line-height: 1; }

  /* Kebun */
  .chip small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); }
  .chip.selected { background: var(--on-bg); color: var(--on-ink); }
  .chip.selected small { color: inherit; opacity: .8; }
  .farm-actions { display: flex; gap: 8px; margin-top: 12px; }
  .farm-actions .notice-btn { flex: 1; margin: 0; min-height: 40px; }
  .plots { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .plot {
    position: relative; width: 100%; aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    padding: 4px; background: #e9dcc4; border: 1px solid #d6c4a3; border-radius: 10px;
    font: inherit; color: var(--ink); cursor: pointer;
  }
  :root[data-theme="dark"] .plot { background: #3a3126; border-color: #4a3f31; }
  .plot-icon { font-size: 24px; line-height: 1; }
  .plot.empty .plot-icon { opacity: .35; }
  .plot.growing .plot-icon { opacity: .55; transform: scale(.8); }
  .plot.ready { border: 2px solid var(--on-bg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--on-bg) 25%, transparent); }
  .plot.wilted { filter: grayscale(.7); }
  .plot-time { font-size: 10px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .plot.ready .plot-time { color: var(--on-bg); }
  .plot-bar { width: 80%; height: 4px; background: rgba(0, 0, 0, .12); border-radius: 99px; overflow: hidden; }
  .plot-bar span { display: block; height: 100%; background: var(--on-bg); }
  .plot-fx { position: absolute; inset: auto 0 50% 0; font-size: 12px; font-weight: 700; animation: rise 1.5s ease-out forwards; }
  .shop { margin: 0 0 16px; }
  /* Kualitas tempa: warna nama + bingkai kotak item */
  .q-good { --q: #3c9a52; } .q-great { --q: #3a7fd5; } .q-legend { --q: #c98a12; }
  :root[data-theme="dark"] .q-good { --q: #62c47a; } :root[data-theme="dark"] .q-great { --q: #6aa8ff; } :root[data-theme="dark"] .q-legend { --q: #f0b43c; }
  .item.q-good, .item.q-great, .item.q-legend { border: 2px solid var(--q); }
  .item.q-legend { box-shadow: 0 0 0 3px color-mix(in srgb, var(--q) 25%, transparent); }
  .sell-name.q-good, .sell-name.q-great, .sell-name.q-legend, .equip-name.q-good, .equip-name.q-great, .equip-name.q-legend,
  .chip.q-good, .chip.q-great, .chip.q-legend, .odds .q-good, .odds .q-great, .odds .q-legend, .recipe-result.q-good, .recipe-result.q-great, .recipe-result.q-legend { color: var(--q); }
  .odds { margin: 2px 0 0; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .recipe-result small { font-weight: 500; color: var(--muted); }
  .tool .fill.hp { background: #3fa45b; }
  .tool .fill.hp.low { background: var(--danger); }
  .stats dd { text-align: right; }

  .equip { display: grid; gap: 8px; margin-bottom: 12px; }
  .equip-slot { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .equip-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .equip-cur { display: flex; align-items: center; gap: 10px; min-height: 32px; }
  .equip-icon { font-size: 26px; line-height: 1; }
  .equip-name { flex: 1; font-weight: 600; font-size: 14px; }
  .equip-name small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .equip-none { color: var(--muted); font-size: 14px; }
  .equip-options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    min-height: 32px; padding: 0 10px;
    background: var(--track); border: 0; border-radius: 999px;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .chip:disabled, .sell-btn:disabled, .notice-btn:disabled { opacity: .5; cursor: default; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .panel-title { font-weight: 700; }
  .panel-title .level { display: inline; font-size: 12px; }
  .panel-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .panel-hint { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }
  .panel .sell-row { padding: 8px 10px; }
  .panel .notice-btn { margin-top: 10px; }
  .journal { list-style: none; margin: 0; padding: 0; font-size: 13px; max-height: 320px; overflow-y: auto; }
  .journal li { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); }
  .journal li:first-child { border-top: 0; }
  .journal time { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
  .journal .j-lose, .journal .j-home, .journal .j-bagFull { color: var(--danger); }
  .journal .j-start, .journal .j-stop { font-weight: 600; }
  .skill .level { display: block; }
  .skill .bar { margin-top: 4px; }
  .inputs { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; line-height: 1.5; }
  .card.on .inputs { color: inherit; opacity: .85; }

  /* Anvil: satu baris per alat yang bisa ditempa */
  .recipes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .recipe {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px;
  }
  .recipe-icon { flex: none; font-size: 32px; line-height: 1; }
  .recipe-info { flex: 1; min-width: 0; }
  .recipe-name { display: block; font-weight: 600; font-size: 14px; }
  .recipe-meta { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .recipe-result { display: block; font-size: 13px; font-weight: 700; margin-top: 4px; }
  .recipe-result.ok { color: var(--on-bg); }
  .recipe-result.fail { color: var(--danger); }
  .recipe-result.ok.q-good, .recipe-result.ok.q-great, .recipe-result.ok.q-legend { color: var(--q); }
  .forge-btn {
    flex: none; min-width: 84px; min-height: 40px; padding: 0 12px;
    background: var(--on-bg); border: 0; border-radius: 10px;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--on-ink); cursor: pointer;
  }
  .forge-btn:disabled { background: var(--track); color: var(--muted); cursor: default; }
  .recipe.forging .recipe-icon { animation: hammer .5s ease-in-out infinite; transform-origin: 70% 80%; }
  @keyframes hammer { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-35deg); } 60% { transform: rotate(8deg); } }
  .recipe.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .notice {
    background: var(--card); border: 1.5px solid var(--danger); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .notice-title { display: block; font-weight: 600; font-size: 14px; color: var(--danger); }
  .notice-list { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 8px 0 10px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .notice-btn {
    min-height: 32px; padding: 0 12px;
    background: var(--track); border: 0; border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer;
  }

  .market { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .sell-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px;
  }
  .sell-icon { flex: none; font-size: 28px; line-height: 1; }
  .sell-info { flex: 1; min-width: 0; }
  .sell-name { display: block; font-weight: 600; font-size: 14px; }
  .sell-meta { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sell-btn {
    flex: none; min-height: 36px; padding: 0 10px;
    background: var(--track); border: 0; border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
    cursor: pointer; white-space: nowrap;
  }
  .sell-btn:active { transform: scale(.97); }
  .sell-btn.confirm { background: var(--danger); color: var(--card); }

  .setting {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .setting-label { display: block; font-weight: 600; margin-bottom: 10px; }
  .segment { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--track); border-radius: 10px; padding: 4px; }
  .segment button {
    min-height: 36px;
    background: none; border: 0; border-radius: 7px;
    font: inherit; font-size: 14px; color: var(--muted);
    cursor: pointer;
  }
  .reset-btn {
    width: 100%; min-height: 40px;
    background: none; border: 1.5px solid var(--danger); border-radius: 10px;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--danger);
    cursor: pointer;
  }
  .reset-btn.confirm { background: var(--danger); color: var(--card); }
  .segment button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    position: relative;
    display: block;
    width: 100%;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    font: inherit;
    text-align: center;
    cursor: pointer;
    transition: transform .12s, box-shadow .12s, background-color .2s, color .2s, border-color .2s;
  }
  .card.on {
    background: var(--on-bg); border-color: var(--on-bg); color: var(--on-ink);
    transform: translateY(-4px);
    box-shadow: 0 4px 0 var(--on-edge), 0 12px 18px -8px rgba(0, 0, 0, .45);
  }
  .card:active { transform: translateY(0) scale(.97); box-shadow: none; }
  /* Cincin level: garis biru tipis di tepi kartu, mulai dari tengah atas searah jarum jam */
  .card::before {
    content: ""; position: absolute; inset: -1px;
    border-radius: inherit; padding: 2px;
    background: conic-gradient(var(--level) var(--lv, 0%), transparent 0);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    pointer-events: none;
  }
  .level { display: block; font-size: 11px; font-weight: 700; color: var(--level); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .card.on .level { color: inherit; }
  .name { display: block; font-size: 16px; font-weight: 700; }
  .duration { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card.on .duration { color: inherit; opacity: .8; }
  .icon { display: block; font-size: 40px; line-height: 1; margin-top: 12px; }
  svg.emoji { width: 1em; height: 1em; vertical-align: -0.125em; }
  .pop.miss { color: var(--muted); }
  .icon.bump { animation: bump .3s ease-out; }
  @keyframes bump { 40% { transform: scale(1.15); } }

  .bar {
    display: block;
    margin-top: 16px;
    height: 10px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
  }
  .card.on .bar { background: color-mix(in srgb, var(--on-ink) 25%, transparent); }
  .fill { display: block; height: 100%; width: 0%; background: var(--muted); border-radius: inherit; }
  .card.on .fill { background: var(--on-ink); }

  /* Kartu alat: memanjang penuh; ikon di kiri, di sebelahnya level + nama, bar exp, dan counter exp */
  .tool {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .tool-top { display: flex; gap: 14px; align-items: center; }
  .tool-icon { flex: none; font-size: 40px; line-height: 1; }
  .tool-main { flex: 1; min-width: 0; }
  .tool-title { display: flex; align-items: baseline; gap: 6px; }
  .tool .level { font-size: 13px; margin: 0; }
  .tool .bar { margin-top: 8px; }
  .tool .fill { background: var(--level); }
  .tool-xp { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats { margin: 12px 0 0; font-size: 13px; }
  .stats div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .upgrade-btn {
    display: block; width: 100%; min-height: 48px; margin-top: 12px; padding: 6px 12px;
    background: var(--on-bg); border: 0; border-radius: 10px;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--on-ink);
    cursor: pointer;
  }
  .upgrade-btn:disabled { background: var(--track); color: var(--muted); cursor: default; }
  .upgrade-btn:not(:disabled):active { transform: scale(.98); }
  .cost { display: block; font-size: 12px; font-weight: 500; margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* Hasil aksi muncul di posisi acak di dalam kartu (posisinya diatur dari JS) dan boleh menumpuk.
     Latarnya agak transparan, tapi isi kartu di belakangnya dikaburkan supaya angka tetap terbaca. */
  .pop {
    position: absolute;
    padding: 3px 8px;
    background: color-mix(in srgb, var(--card) 70%, transparent); color: var(--ink);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    border-radius: 999px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .15);
    pointer-events: none; white-space: nowrap;
    font-size: 14px; font-weight: 700; line-height: 1.2;
    animation: rise 1.6s ease-out forwards;
  }
  @keyframes rise {
    from { transform: translateY(6px); opacity: 0; }
    20% { transform: translateY(0); opacity: 1; }
    70% { opacity: 1; }
    to { transform: translateY(-8px); opacity: 0; }
  }

  /* Grup & level menu dan judul halaman hanya tampil di layout desktop */
  .nav-group, .nav-lv, .page-title { display: none; }

  /* Desktop: sidebar tetap di kiri dengan grup kegiatan dan level skill, bar atas berisi judul halaman,
     konten melebar dengan grid kartu beberapa kolom. Ponsel tetap memakai drawer. */
  @media (min-width: 900px) {
    :root { --side-w: 248px; --side-bg: #1f2b24; --side-ink: #e8eee9; --side-muted: #8fa396; --side-hover: #2a3a30; --side-cur: #355042; }
    :root[data-theme="dark"] { --side-bg: #0e1310; --side-hover: #1a231d; --side-cur: #24352a; }
    body { padding: 0 0 0 var(--side-w); }
    .scrim, .menu-btn, header h1 { display: none; }
    .drawer {
      transform: none; visibility: visible; transition: none;
      left: 0; right: auto; width: var(--side-w);
      background: var(--side-bg); color: var(--side-ink); border: 0;
      padding: 0 0 24px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: var(--side-hover) transparent;
    }
    .drawer .brand {
      position: sticky; top: 0; z-index: 1;
      height: 56px; display: flex; align-items: center; padding: 0 20px;
      background: var(--side-bg); border-bottom: 1px solid rgba(255, 255, 255, .06);
      font-size: 17px; letter-spacing: .01em;
    }
    .nav-group {
      display: block; padding: 18px 20px 6px;
      font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--side-muted);
    }
    .nav-item {
      position: relative; gap: 12px; padding: 7px 16px 7px 20px; border-radius: 0;
      font-size: 14px; color: var(--side-ink);
    }
    .nav-item:hover { background: var(--side-hover); }
    .nav-item:active { background: var(--side-cur); }
    .nav-item[aria-current="page"] { background: var(--side-cur); }
    .nav-item[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #6fcf86; }
    .nav-item:disabled:hover { background: none; }
    .nav-item > span:first-child { flex: none; width: 24px; text-align: center; font-size: 18px; }
    .nav-text { flex: 1; min-width: 0; }
    .nav-lock { color: var(--side-muted); }
    .nav-lv {
      display: block; margin-left: auto; flex: none;
      font-size: 12px; font-weight: 600; color: var(--side-muted); font-variant-numeric: tabular-nums;
    }
    .nav-item[aria-current="page"] .nav-lv { color: var(--side-ink); }
    .nav-item:disabled .nav-lv { display: none; }
    /* Titik hijau berdenyut di kegiatan yang sedang berjalan */
    .nav-item.running > span:first-child { position: relative; }
    .nav-item.running > span:first-child::after {
      content: ""; position: absolute; right: -3px; top: -1px; width: 8px; height: 8px;
      border-radius: 50%; background: #6fcf86; box-shadow: 0 0 0 2px var(--side-bg);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .35; } }

    .app { max-width: none; margin: 0; }
    header {
      position: sticky; top: 0; z-index: 4;
      height: 56px; margin: 0; padding: 0 32px;
      background: var(--card); border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
    }
    .page-title { display: block; font-size: 18px; font-weight: 700; }
    .kepeng { padding: 6px 14px; background: var(--track); border-radius: 999px; font-size: 15px; }
    main { max-width: 1280px; padding: 24px 32px 48px; }
    main > :first-child { margin-top: 0; }

    .tool, .panel { border-radius: 12px; padding: 18px 20px; }
    .tool .stats { max-width: 440px; }
    .farm-actions { max-width: 520px; }
    .upgrade-btn { display: inline-block; width: auto; min-width: 280px; }
    .cards { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { border-radius: 12px; }
    .card:hover:not(.locked):not(.on) { border-color: var(--muted); }
    .market, .recipes { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
    .items { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
    .plots { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
    .plot-icon { font-size: 30px; }
    .sort { max-width: 420px; }
    .equip { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    #page-settings { max-width: 640px; }

    /* Petualangan: status di kiri, perlengkapan di kanan, kartu penuh; tas, bekal, dan jurnal berdampingan */
    #page-petualangan:not([hidden]) { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
    #page-petualangan > * { margin: 0; }
    #page-petualangan > .tool { grid-column: 1; }
    #page-petualangan > .equip { grid-column: 2 / -1; grid-template-columns: 1fr 1fr; align-self: stretch; }
    #page-petualangan > .cards { grid-column: 1 / -1; }
    #page-petualangan .panel .market { grid-template-columns: 1fr; }
    .journal { max-height: 480px; }
  }
  @media (min-width: 900px) and (max-width: 1279px) {
    #page-petualangan:not([hidden]) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #page-petualangan > .equip { grid-column: 2; grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="Menu">
  <div class="brand">Kebon Kosong</div>
  <div class="nav-group" data-i18n="navGather"></div>
  <button class="nav-item" data-page="kebun"><span class="nav-icon">🌾</span><span data-i18n="farm"></span><span class="nav-lv"></span></button>
  <button class="nav-item" data-page="hutan"><span class="nav-icon">🌳</span><span data-i18n="forest"></span><span class="nav-lv"></span></button>
  <button class="nav-item" data-page="goa"><span class="nav-icon">⛰️</span><span class="nav-text"><span data-i18n="cave"></span><small class="nav-lock" data-i18n="caveLocked"></small></span><span class="nav-lv"></span></button>
  <button class="nav-item" data-page="sungai"><span class="nav-icon">🏞️</span><span class="nav-text"><span data-i18n="river"></span><small class="nav-lock" data-i18n="riverLocked"></small></span><span class="nav-lv"></span></button>
  <button class="nav-item" data-page="danau"><span class="nav-icon">🌊</span><span class="nav-text"><span data-i18n="lake"></span><small class="nav-lock" data-i18n="lakeLocked"></small></span></button>
  <button class="nav-item" data-page="laut"><span class="nav-icon">⛵</span><span class="nav-text"><span data-i18n="sea"></span><small class="nav-lock" data-i18n="seaLocked"></small></span></button>
  <div class="nav-group" data-i18n="navCraft"></div>
  <button class="nav-item" data-page="dapur"><span class="nav-icon">🍳</span><span data-i18n="kitchen"></span><span class="nav-lv"></span></button>
  <button class="nav-item" data-page="anvil"><span class="nav-icon">⚒️</span><span data-i18n="anvil"></span><span class="nav-lv"></span></button>
  <div class="nav-group" data-i18n="navCombat"></div>
  <button class="nav-item" data-page="petualangan"><span class="nav-icon">⚔️</span><span class="nav-text"><span data-i18n="adventure"></span><small class="nav-lock" data-i18n="advLocked"></small></span><span class="nav-lv"></span></button>
  <div class="nav-group" data-i18n="navOther"></div>
  <button class="nav-item" data-page="rumah"><span class="nav-icon">🏠</span><span data-i18n="house"></span></button>
  <button class="nav-item" data-page="pasar"><span class="nav-icon">🏪</span><span data-i18n="market"></span></button>
  <button class="nav-item" data-page="settings"><span class="nav-icon">⚙️</span><span data-i18n="settings"></span></button>
</nav>

<div class="app">
  <header>
    <h1>Kebon Kosong</h1>
    <span class="page-title" id="page-title"></span>
    <span class="kepeng" id="kepeng"></span>
    <button class="menu-btn" id="menu-btn" aria-controls="drawer" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <main id="page-kebun" hidden>
    <section class="tool">
      <div class="tool-top">
        <span class="tool-icon" aria-hidden="true">🧑‍🌾</span>
        <div class="tool-main">
          <div class="tool-title"><span class="level" id="farm-level"></span><span class="name" data-i18n="farming"></span></div>
          <span class="bar"><span class="fill" id="farm-fill"></span></span>
          <span class="tool-xp" id="farm-xp"></span>
        </div>
      </div>
      <dl class="stats"><div><dt id="farm-plots"></dt></div></dl>
      <button class="upgrade-btn" id="farm-buy"><span id="farm-buy-text"></span><span class="cost" id="farm-buy-cost"></span></button>
    </section>
    <section class="panel">
      <div class="panel-head"><span class="panel-title" data-i18n="chooseSeed"></span></div>
      <div class="equip-options" id="farm-seeds"></div>
      <p class="empty" id="farm-no-seeds" data-i18n="noSeeds"></p>
      <div class="farm-actions">
        <button class="notice-btn" id="farm-plant-all" data-i18n="plantAll"></button>
        <button class="notice-btn" id="farm-harvest-all" data-i18n="harvestAll"></button>
      </div>
    </section>
    <ul class="plots" id="plots"></ul>
  </main>

  <main id="page-hutan">
    <section class="tool" data-tool="axe"></section>
    <div class="cards" data-area="hutan"></div>
  </main>

  <main id="page-goa" hidden>
    <section class="tool" data-tool="pickaxe"></section>
    <div class="cards" data-area="goa"></div>
  </main>

  <main id="page-sungai" hidden>
    <section class="tool" data-tool="rod"></section>
    <div class="cards" data-area="sungai"></div>
  </main>

  <main id="page-danau" hidden>
    <div class="cards" data-area="danau"></div>
  </main>

  <main id="page-laut" hidden>
    <div class="cards" data-area="laut"></div>
  </main>

  <main id="page-dapur" hidden>
    <section class="tool">
      <div class="tool-top">
        <span class="tool-icon" aria-hidden="true">🍳</span>
        <div class="tool-main">
          <div class="tool-title"><span class="level" id="kitchen-level"></span><span class="name" data-i18n="kitchen"></span></div>
          <span class="tool-xp" id="kitchen-desc"></span>
        </div>
      </div>
      <div class="skill">
        <span class="level" id="cooking-level"></span>
        <span class="bar"><span class="fill" id="cooking-fill"></span></span>
        <span class="tool-xp" id="cooking-xp"></span>
      </div>
      <dl class="stats"><div id="cook-speed-row"><dt data-i18n="cookSpeed"></dt><dd id="cook-speed"></dd></div></dl>
      <button class="upgrade-btn" id="kitchen-upgrade"><span id="kitchen-next"></span><span class="cost" id="kitchen-cost"></span></button>
    </section>
    <div class="cards" data-area="dapur"></div>
  </main>

  <main id="page-petualangan" hidden>
    <section class="tool">
      <div class="tool-top">
        <span class="tool-icon" aria-hidden="true">⚔️</span>
        <div class="tool-main">
          <div class="tool-title"><span class="name" id="adv-hp"></span></div>
          <span class="bar"><span class="fill hp" id="adv-hp-fill"></span></span>
        </div>
      </div>
      <div class="skill"><span class="level"><span data-i18n="melee"></span> <span id="melee-level"></span></span>
        <span class="bar"><span class="fill" id="melee-fill"></span></span><span class="tool-xp" id="melee-xp"></span></div>
      <div class="skill"><span class="level"><span data-i18n="armorSkill"></span> <span id="armor-level"></span></span>
        <span class="bar"><span class="fill" id="armor-fill"></span></span><span class="tool-xp" id="armor-xp"></span></div>
      <dl class="stats">
        <div><dt data-i18n="attack"></dt><dd id="adv-atk"></dd></div>
        <div><dt data-i18n="interval"></dt><dd id="adv-interval"></dd></div>
        <div><dt data-i18n="defense"></dt><dd id="adv-def"></dd></div>
        <div><dt data-i18n="winChance"></dt><dd id="adv-win"></dd></div>
      </dl>
    </section>
    <section class="equip" id="equip"></section>
    <div class="cards" data-area="petualangan"></div>

    <section class="panel">
      <div class="panel-head"><span class="panel-title">🎒 <span data-i18n="bag"></span> <span class="level" id="bag-level"></span></span><span class="panel-meta" id="bag-slots"></span></div>
      <ul class="market" id="bag-items"></ul>
      <p class="empty" id="bag-empty" data-i18n="bagEmpty"></p>
      <button class="notice-btn" id="bag-store-all" data-i18n="storeAll"></button>
      <button class="upgrade-btn" id="bag-upgrade"><span id="bag-next"></span><span class="cost" id="bag-cost"></span></button>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="panel-title" data-i18n="pack"></span></div>
      <p class="panel-hint" data-i18n="packHint"></p>
      <ul class="market" id="pack"></ul>
      <p class="empty" id="pack-empty" data-i18n="noFood"></p>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="panel-title">📜 <span data-i18n="journal"></span></span></div>
      <p class="panel-hint" id="adv-summary"></p>
      <ol class="journal" id="journal"></ol>
      <p class="empty" id="journal-empty" data-i18n="journalEmpty"></p>
    </section>
  </main>

  <main id="page-rumah" hidden>
    <section class="tool">
      <div class="tool-top">
        <span class="tool-icon" aria-hidden="true">🏠</span>
        <div class="tool-main">
          <div class="tool-title"><span class="level" id="house-level"></span><span class="name" data-i18n="house"></span></div>
          <span class="bar"><span class="fill" id="house-fill"></span></span>
          <span class="tool-xp" id="house-slots"></span>
        </div>
      </div>
      <button class="upgrade-btn" id="house-upgrade"><span id="house-next"></span><span class="cost" id="house-cost"></span></button>
    </section>
    <section class="notice" id="discarded" hidden>
      <span class="notice-title" data-i18n="discarded"></span>
      <div class="notice-list" id="discarded-list"></div>
      <button class="notice-btn" id="discarded-dismiss" data-i18n="dismiss"></button>
    </section>
    <div class="segment three sort">
      <button data-sort-choice="cat" data-i18n="sortCat"></button>
      <button data-sort-choice="qty" data-i18n="sortQty"></button>
      <button data-sort-choice="name" data-i18n="sortName"></button>
    </div>
    <div id="items"></div>
    <div class="tip" id="tip" role="status" hidden></div>
    <p class="empty" id="empty" data-i18n="empty"></p>
  </main>

  <main id="page-pasar" hidden>
    <section class="panel shop">
      <div class="panel-head"><span class="panel-title">🌱 <span data-i18n="buySeeds"></span></span></div>
      <p class="panel-hint" data-i18n="rareSeedHint"></p>
      <ul class="market" id="seed-shop"></ul>
    </section>
    <h2 data-i18n="market"></h2>
    <ul class="market" id="market"></ul>
    <p class="empty" id="market-empty" data-i18n="marketEmpty"></p>
  </main>

  <main id="page-anvil" hidden>
    <section class="tool">
      <div class="tool-top">
        <span class="tool-icon" aria-hidden="true">⚒️</span>
        <div class="tool-main">
          <div class="tool-title"><span class="level" id="anvil-level"></span><span class="name" data-i18n="anvil"></span></div>
          <span class="tool-xp" id="anvil-desc"></span>
        </div>
      </div>
      <div class="skill"><span class="level"><span data-i18n="smithing"></span> <span id="smith-level"></span></span>
        <span class="bar"><span class="fill" id="smith-fill"></span></span><span class="tool-xp" id="smith-xp"></span></div>
      <dl class="stats"><div><dt data-i18n="qualityOdds"></dt></div></dl>
      <p class="odds" id="quality-odds"></p>
      <button class="upgrade-btn" id="anvil-upgrade"><span id="anvil-next"></span><span class="cost" id="anvil-cost"></span></button>
    </section>
    <ul class="recipes" id="recipes"></ul>
  </main>

  <main id="page-settings" hidden>
    <h2 data-i18n="settings"></h2>
    <div class="setting">
      <span class="setting-label" data-i18n="theme"></span>
      <div class="segment">
        <button data-theme-choice="light" data-i18n="light"></button>
        <button data-theme-choice="dark" data-i18n="dark"></button>
      </div>
    </div>
    <div class="setting">
      <span class="setting-label" data-i18n="language"></span>
      <div class="segment">
        <button data-lang-choice="id">Indonesia</button>
        <button data-lang-choice="en">English</button>
      </div>
    </div>
    <div class="setting">
      <span class="setting-label" data-i18n="sound"></span>
      <div class="segment">
        <button data-sound-choice="on" data-i18n="on"></button>
        <button data-sound-choice="off" data-i18n="off"></button>
      </div>
    </div>
    <div class="setting">
      <span class="setting-label" data-i18n="progress"></span>
      <button class="reset-btn" id="reset" data-i18n="reset"></button>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/debug.js"></script>
</body>
</html>
