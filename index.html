<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a1f">
<title>Kebon Kosong</title>
<style>
  :root {
    --bg: #f3efe6;
    --card: #fffdf8;
    --ink: #2a2620;
    --muted: #7a7266;
    --line: #e4ddcf;
    --track: #ebe5d8;
    --wood: #a0673a;
    --on-bg: #3f7d4e;
    --on-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a16;
      --card: #1d2520;
      --ink: #ece7dc;
      --muted: #9a9486;
      --line: #2c3530;
      --track: #2a332d;
      --wood: #c98a55;
      --on-bg: #2f6b3e;
      --on-ink: #eaf5ec;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .app { max-width: 480px; margin: 0 auto; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 0 20px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .total { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .total b { color: var(--wood); font-size: 18px; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    display: block;
    width: 100%;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    font: inherit;
    text-align: center;
    cursor: pointer;
    transition: transform .1s, background-color .2s, color .2s, border-color .2s;
  }
  .card:active { transform: scale(.96); }
  .card.on { background: var(--on-bg); border-color: var(--on-bg); color: var(--on-ink); }
  .name { display: block; font-size: 16px; font-weight: 700; }
  .duration { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card.on .duration { color: inherit; opacity: .8; }
  .icon { display: block; font-size: 40px; line-height: 1; margin-top: 12px; }

  .bar {
    display: block;
    margin-top: 16px;
    height: 10px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
  }
  .card.on .bar { background: color-mix(in srgb, var(--on-ink) 25%, transparent); }
  .fill { display: block; height: 100%; width: 0%; background: var(--muted); border-radius: inherit; }
  .card.on .fill { background: var(--on-ink); }

  .pop {
    position: fixed; pointer-events: none;
    font-weight: 700; color: var(--wood);
    animation: rise .9s ease-out forwards;
  }
  @keyframes rise { to { transform: translateY(-40px); opacity: 0; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Kebon Kosong</h1>
    <div class="total">🪵 <b id="wood">0</b> kayu</div>
  </header>

  <div class="cards">
  <button class="card" id="toggle" aria-pressed="false">
    <span class="name">Pohon Akasia</span>
    <span class="duration" id="duration">2 detik</span>
    <span class="icon">🌳</span>
    <span class="bar"><span class="fill" id="fill"></span></span>
  </button>
  </div>
</div>

<script>
  const CHOP_TIME = 2000; // ms per tebangan
  const SAVE_KEY = 'kebon-kosong';
  try { localStorage.removeItem('idle-penebang-v1'); } catch {} // buang simpanan versi lama

  const state = { wood: 0, running: false, progress: 0, lastTick: Date.now() };

  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (saved) Object.assign(state, saved);
  } catch {}

  const $ = id => document.getElementById(id);
  const woodEl = $('wood'), fillEl = $('fill'), btn = $('toggle');
  $('duration').textContent = (CHOP_TIME / 1000) + ' detik';

  // Progres offline: kalau sedang berjalan saat ditutup, hitung tebangan yang terlewat
  if (state.running) {
    const elapsed = Date.now() - state.lastTick + state.progress;
    state.wood += Math.floor(elapsed / CHOP_TIME);
    state.progress = elapsed % CHOP_TIME;
  }

  function save() {
    state.lastTick = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch {}
  }

  function popup() {
    const r = woodEl.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'pop';
    el.textContent = '+1';
    el.style.left = r.left + 'px';
    el.style.top = (r.bottom + 4) + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function render() {
    woodEl.textContent = Math.floor(state.wood).toLocaleString('id-ID');
    fillEl.style.width = (state.progress / CHOP_TIME * 100) + '%';
    btn.classList.toggle('on', state.running);
    btn.setAttribute('aria-pressed', state.running);
  }

  btn.addEventListener('click', () => {
    state.running = !state.running;
    save();
    render();
  });

  let last = performance.now();
  function loop(now) {
    const dt = now - last;
    last = now;
    if (state.running) {
      state.progress += dt;
      if (state.progress >= CHOP_TIME) {
        const chops = Math.floor(state.progress / CHOP_TIME);
        state.wood += chops;
        state.progress %= CHOP_TIME;
        popup();
      }
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  setInterval(save, 5000);
  document.addEventListener('visibilitychange', save);
  window.addEventListener('pagehide', save);
</script>
</body>
</html>
