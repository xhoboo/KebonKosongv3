<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<title>Kebon Kosong</title>
<style>
  /* Token monokrom (panel admin). Warna hanya untuk ikon, bar, dan glow item grade tinggi. */
  :root {
    color-scheme: dark;
    --bg: #0a0a0a;
    --card: #111111;
    --panel: #111111;
    --panel-2: #161616;
    --sunken: #0d0d0d;
    --line: #242424;
    --line-2: #2e2e2e;
    --line-strong: #3a3a3a;
    --track: #1f1f1f;
    --ink: #f0f0f0;
    --ink-2: #d4d4d4;
    --muted: #8c8c8c;
    --dim: #5c5c5c;
    --off: #4d4d4d;
    --wood: #c98a55;
    --on-bg: var(--panel-2);
    --on-ink: var(--ink);
    --on-edge: var(--ink);
    --level: #5b9cff;
    --danger: #ff6b5b;
    --side-bg: var(--bg);
    --side-hover: #141414;
    --side-cur: var(--panel-2);
    --bar-action: #6fcf73;
    --bar-xp: #5b9cff;
    --bar-grow: #b8d86b;
    --bar-short: #e0a64f;
    --bar-hp: #e5534b;
    --q-common: #8c8c8c;
    --q-good: #6fcf73;
    --q-great: #5b9cff;
    --q-legend: #f2b544;
    --glow-great: 0 0 10px rgba(91, 156, 255, .28), inset 0 0 8px rgba(91, 156, 255, .12);
    --glow-legend: 0 0 12px rgba(242, 181, 68, .30), inset 0 0 8px rgba(242, 181, 68, .14);
    --r: 6px;
    --r-sm: 4px;
    --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease-out: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-tap-highlight-color: transparent;
    /* ruang untuk tab bar (+ dock aktivitas) yang menempel di bawah */
    padding: 0 0 calc(var(--tabbar-h) + var(--dock-h, 0px) + env(safe-area-inset-bottom));
  }
  :root { --tabbar-h: 62px; }
  button { font-family: inherit; }
  .mono, .counter, .crumb-group, .nav-group, .nav-lv, .tool-xp, .duration, .item-qty, .plot-time, .cost, .stats dd, .panel-meta, .journal time {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  .caps { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; font-weight: 500; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  .app { max-width: 640px; margin: 0 auto; }
  main { padding: 14px 16px 24px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
  .lock-svg { flex: none; width: 10px; height: 10px; }

  /* ---------- Navigasi ponsel: bar atas + sub-tab (menempel di atas), tab bar di bawah ---------- */
  .top { position: sticky; top: 0; z-index: 6; background: var(--bg); }
  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: max(16px, env(safe-area-inset-top)) 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: none; }
  .crumb { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .crumb-group { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .page-title { font-size: 20px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .counter {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    border: 1px solid var(--line); border-radius: var(--r); padding: 6px 9px;
    font-size: 13px; font-weight: 500; white-space: nowrap;
  }
  .counter-icon { display: inline-block; line-height: 1; }
  .counter-icon.bump { animation: bump .3s ease-out; }
  .subtabs { display: flex; overflow-x: auto; padding: 0 8px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .subtabs::-webkit-scrollbar { display: none; }
  .subtab {
    flex: none; display: flex; align-items: center; gap: 5px; min-height: 44px; padding: 0 10px; margin-bottom: -1px;
    background: none; border: 0; border-bottom: 1px solid transparent; border-radius: 0;
    font: inherit; font-size: 13px; color: #a3a3a3; cursor: pointer;
  }
  .subtab[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .subtab[aria-disabled="true"] { color: var(--dim); cursor: default; }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    border-top: 1px solid var(--line); background: var(--bg);
    padding: 4px 4px max(10px, env(safe-area-inset-bottom));
  }
  .tab {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
    min-height: 48px; padding: 7px 0; background: none; border: 0;
    font: inherit; font-size: 10px; font-weight: 500; color: var(--muted); cursor: pointer;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab[aria-current="page"] { color: var(--ink); font-weight: 600; }
  .tab[aria-current="page"]::before {
    content: ""; position: absolute; top: -5px; left: 22%; right: 22%; height: 1px; background: var(--ink);
    animation: tab-line .3s var(--ease-out) both;
  }
  .tab[aria-disabled="true"] { color: var(--off); cursor: default; }
  .drawer { display: none; }
  @keyframes tab-line { from { transform: scaleX(0); } }
  @keyframes nav-line { from { transform: scaleY(0); } }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes nope { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
  .nope { animation: nope .32s ease-out; }
  .live { animation: blink 1.4s ease-in-out infinite; }

  .items { list-style: none; margin: 0; padding: 0 0 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 20px 8px; }
  .item {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 6px 4px 10px;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--r);
    font: inherit;
    cursor: pointer;
  }
  .item[aria-expanded="true"] { border-color: var(--muted); }
  /* Popup nama item, melayang di atas kotak */
  .tip {
    position: fixed; z-index: 5;
    transform: translate(-50%, -100%);
    padding: 6px 10px;
    background: var(--ink); color: var(--bg);
    border-radius: 8px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
    pointer-events: none;
    animation: tip-in .15s ease-out;
  }
  .tip::after {
    content: ""; position: absolute; left: 50%; top: 100%;
    margin-left: calc(var(--arrow, 0px) - 5px);
    border: 5px solid transparent; border-top-color: var(--ink);
  }
  @keyframes tip-in { from { opacity: 0; transform: translate(-50%, calc(-100% + 4px)); } }
  .item-icon { font-size: 30px; line-height: 1; }
  /* Counter duduk di tengah garis bawah kotak */
  .item-qty {
    position: absolute; left: 50%; bottom: 0;
    transform: translate(-50%, 50%);
    min-width: 28px; padding: 2px 8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 12px; font-weight: 700; line-height: 1.2;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }
  .group { font-size: 12px; font-weight: 600; color: var(--muted); margin: 4px 0 10px; }
  .items + .group { margin-top: 12px; }
  .segment.three { grid-template-columns: repeat(3, 1fr); }
  .sort { margin-bottom: 16px; }
  .tool .fill.full { background: var(--danger); }
  .pop.full { color: var(--danger); }
  .emoji-teak { display: inline-block; filter: brightness(.68) saturate(1.5) hue-rotate(-8deg); }
  .emoji-fish { display: inline-block; }
  .tint { display: inline-block; }
  .tint.mahogany { filter: hue-rotate(-20deg) saturate(1.6) brightness(.8); }
  .tint.ulin { filter: brightness(.45) saturate(.8); }
  .tint.iron { filter: grayscale(.6) brightness(.9); }
  .tint.gold { filter: sepia(1) saturate(3) hue-rotate(5deg) brightness(1.05); }
  .tint.scale { filter: hue-rotate(60deg) saturate(.8); }
  .tint.eel { filter: sepia(.8) brightness(.6); }
  .tint.grouper { filter: sepia(.7) hue-rotate(-20deg) saturate(1.4) brightness(.8); }
  .emoji-fish.carp { filter: sepia(1) saturate(3) hue-rotate(-15deg); }
  .emoji-fish.pangasius { filter: grayscale(.8) brightness(1.1); }
  .emoji-fish.giantSnakehead { filter: hue-rotate(70deg) brightness(.6); }
  .emoji-fish.mackerel { filter: hue-rotate(20deg) saturate(1.4); }
  .emoji-fish.tuna { filter: brightness(.55) saturate(1.3); }
  .emoji-fish.wader { transform: scale(.8); }
  .emoji-fish.tilapia { filter: hue-rotate(150deg) saturate(.7); }
  .emoji-fish.catfish { filter: grayscale(1) brightness(.65); }
  .emoji-fish.snakehead { filter: sepia(1) saturate(2.2) hue-rotate(-25deg) brightness(.75); }


  /* Node terkunci: tidak bisa diklik, ikon pudar, syarat ditampilkan */
  .card.locked { cursor: default; }
  .card.locked:active { transform: none; }
  .card.locked .icon { filter: grayscale(1); opacity: .35; }
  .card.locked .level { visibility: hidden; }
  .tool-hint { display: block; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .skill { margin-top: 12px; }
  .emoji-cooked { display: inline-block; filter: sepia(.6) saturate(1.4) brightness(.8); }
  .emoji-seed { position: relative; display: inline-block; }
  .seed-of { position: absolute; right: -.25em; bottom: -.15em; font-size: .5em; line-height: 1; }

  /* Kebun */
  .chip small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); }
  .chip.selected { background: var(--ink); color: var(--bg); }
  .chip.selected small { color: inherit; opacity: .8; }
  .farm-actions { display: flex; gap: 8px; margin-top: 12px; }
  .farm-actions .notice-btn { flex: 1; margin: 0; min-height: 40px; }
  .plots { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .plot {
    position: relative; width: 100%; aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    padding: 4px; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r);
    font: inherit; color: var(--ink); cursor: pointer;
  }
  .plot-icon { font-size: 24px; line-height: 1; }
  .plot.empty { border-style: dashed; border-color: var(--dim); }
  .plot.empty .plot-icon { opacity: .35; }
  .plot.growing .plot-icon { opacity: .55; transform: scale(.8); }
  .plot.ready { background: var(--panel-2); border-color: var(--ink); }
  .plot.wilted { filter: grayscale(.7); }
  .plot-time { font-size: 10px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .plot.ready .plot-time { color: var(--ink); }
  .plot-bar { width: 80%; height: 3px; background: var(--track); border-radius: 2px; overflow: hidden; }
  .plot-bar span { display: block; height: 100%; background: var(--bar-grow); }
  .plot-fx { position: absolute; inset: auto 0 50% 0; font-size: 12px; font-weight: 700; animation: rise 1.5s ease-out forwards; }
  .shop { margin: 0 0 16px; }
  /* Kualitas tempa: warna nama + bingkai kotak item */
  .q-good { --q: var(--q-good); } .q-great { --q: var(--q-great); } .q-legend { --q: var(--q-legend); }
  /* Glow tipis hanya untuk Istimewa & Pusaka di kotak inventori */
  .item.q-great { border-color: rgba(91, 156, 255, .55); box-shadow: var(--glow-great); }
  .item.q-legend { border-color: rgba(242, 181, 68, .6); box-shadow: var(--glow-legend); }
  .sell-name.q-good, .sell-name.q-great, .sell-name.q-legend, .equip-name.q-good, .equip-name.q-great, .equip-name.q-legend,
  .chip.q-good, .chip.q-great, .chip.q-legend, .odds .q-good, .odds .q-great, .odds .q-legend, .recipe-result.q-good, .recipe-result.q-great, .recipe-result.q-legend { color: var(--q); }
  .odds { margin: 2px 0 0; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .recipe-result small { font-weight: 500; color: var(--muted); }
  .tool .fill.hp { background: var(--bar-hp); }
  .tool .fill.hp.low { background: var(--danger); }
  .stats dd { text-align: right; }

  .equip { display: grid; gap: 8px; margin-bottom: 12px; }
  .equip-slot { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
  .equip-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
  .equip-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; min-height: 24px; }
  .equip-toggle {
    display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 8px; margin-right: -6px;
    background: none; border: 0; border-radius: 6px;
    font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .equip-toggle:hover { background: var(--track); }
  .caret { width: 7px; height: 7px; border: solid currentColor; border-width: 0 2px 2px 0; transform: translateY(-2px) rotate(45deg); transition: transform .15s; }
  .equip-toggle[aria-expanded="true"] .caret { transform: translateY(1px) rotate(-135deg); }
  .equip-cur { display: flex; align-items: center; gap: 10px; min-height: 32px; }
  .equip-icon { font-size: 26px; line-height: 1; }
  .equip-name { flex: 1; font-weight: 600; font-size: 14px; }
  .equip-name small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .equip-none { color: var(--muted); font-size: 14px; }
  .equip-options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    min-height: 32px; padding: 0 10px;
    background: var(--track); border: 0; border-radius: var(--r-sm);
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .chip:disabled, .sell-btn:disabled, .notice-btn:disabled { opacity: .5; cursor: default; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-top: 12px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .panel-title { font-weight: 700; }
  .panel-title .level { display: inline; font-size: 12px; }
  .panel-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .panel-hint { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }
  .panel .sell-row { padding: 8px 10px; }
  .panel .notice-btn { margin-top: 10px; }
  .journal { list-style: none; margin: 0; padding: 0; font-size: 13px; max-height: 320px; overflow-y: auto; }
  .journal li { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); }
  .journal li:first-child { border-top: 0; }
  .journal time { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
  .journal .j-lose, .journal .j-home, .journal .j-bagFull { color: var(--danger); }
  .journal .j-start, .journal .j-stop { font-weight: 600; }
  .skill .level { display: block; }
  .skill .bar { margin-top: 4px; }
  .inputs { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; line-height: 1.5; }
  .card.on .inputs { color: inherit; opacity: .85; }

  /* Anvil: satu baris per alat yang bisa ditempa */
  .recipes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .recipe {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 12px;
  }
  .recipe-icon { flex: none; font-size: 32px; line-height: 1; }
  .recipe-info { flex: 1; min-width: 0; }
  .recipe-name { display: block; font-weight: 600; font-size: 14px; }
  .recipe-meta { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .recipe-result { display: block; font-size: 13px; font-weight: 700; margin-top: 4px; }
  .recipe-result.ok { color: var(--ink); }
  .recipe-result.fail { color: var(--muted); }
  .recipe-result.ok.q-good, .recipe-result.ok.q-great, .recipe-result.ok.q-legend { color: var(--q); }
  .forge-btn {
    flex: none; min-width: 84px; min-height: 40px; padding: 0 12px;
    background: var(--ink); border: 1px solid var(--ink); border-radius: var(--r);
    font: inherit; font-size: 14px; font-weight: 600; color: var(--bg); cursor: pointer;
  }
  .forge-btn:disabled { background: var(--panel-2); border-color: var(--line-strong); color: var(--muted); cursor: default; }
  .recipe.forging .recipe-icon { animation: hammer .5s ease-in-out infinite; transform-origin: 70% 80%; }
  @keyframes hammer { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-35deg); } 60% { transform: rotate(8deg); } }
  .recipe.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .notice {
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r);
    padding: 12px 14px; margin-bottom: 12px;
  }
  .notice-title { display: block; font-weight: 600; font-size: 14px; color: var(--ink); }
  .notice-list { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 8px 0 10px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .notice-btn {
    min-height: 32px; padding: 0 12px;
    background: var(--track); border: 0; border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer;
  }

  .market { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .sell-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 10px 12px;
  }
  .sell-icon { flex: none; font-size: 28px; line-height: 1; }
  .sell-info { flex: 1; min-width: 0; }
  .sell-name { display: block; font-weight: 600; font-size: 14px; }
  .sell-meta { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sell-btn {
    flex: none; min-height: 36px; padding: 0 10px;
    background: var(--track); border: 0; border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
    cursor: pointer; white-space: nowrap;
  }
  .sell-btn:active { transform: scale(.97); }
  .sell-btn.confirm { border-color: var(--danger); color: var(--danger); }

  .setting {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .setting-label { display: block; font-weight: 600; margin-bottom: 10px; }
  .segment { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--track); border-radius: var(--r); padding: 4px; }
  .segment button {
    min-height: 36px;
    background: none; border: 0; border-radius: 7px;
    font: inherit; font-size: 14px; color: var(--muted);
    cursor: pointer;
  }
  .reset-btn {
    width: 100%; min-height: 40px;
    background: none; border: 1.5px solid var(--danger); border-radius: var(--r);
    font: inherit; font-size: 14px; font-weight: 600; color: var(--danger);
    cursor: pointer;
  }
  .reset-btn.confirm { background: var(--panel-2); }
  .segment button[aria-pressed="true"] { background: var(--track); color: var(--ink); font-weight: 600; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    position: relative;
    display: block;
    width: 100%;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 16px;
    font: inherit;
    text-align: center;
    cursor: pointer;
    transition: transform .12s, box-shadow .12s, background-color .2s, color .2s, border-color .2s;
  }
  .card.on { background: var(--panel-2); border-color: var(--ink); }
  .card:active { transform: scale(.97); }
  /* Cincin level: garis biru tipis di tepi kartu, mulai dari tengah atas searah jarum jam */
  .card::before {
    content: ""; position: absolute; inset: -1px;
    border-radius: inherit; padding: 2px;
    background: conic-gradient(var(--bar-xp) var(--lv, 0%), transparent 0);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    pointer-events: none;
  }
  .level { display: block; font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .card.on .level { color: inherit; }
  .name { display: block; font-size: 16px; font-weight: 700; }
  .duration { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card.on .duration { color: inherit; opacity: .8; }
  .icon { display: block; font-size: 40px; line-height: 1; margin-top: 12px; }
  svg.emoji { width: 1em; height: 1em; vertical-align: -0.125em; }
  .pop.miss { color: var(--muted); }
  .icon.bump { animation: bump .3s ease-out; }
  @keyframes bump { 40% { transform: scale(1.15); } }

  .bar {
    display: block;
    margin-top: 16px;
    height: 10px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
  }
    .fill { display: block; height: 100%; width: 0%; background: var(--bar-action); border-radius: inherit; }

  /* Kartu alat: memanjang penuh; ikon di kiri, di sebelahnya level + nama, bar exp, dan counter exp */
  .tool {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 16px;
    margin-bottom: 12px;
  }
  .tool-top { display: flex; gap: 14px; align-items: center; }
  .tool-icon { flex: none; font-size: 40px; line-height: 1; }
  .tool-main { flex: 1; min-width: 0; }
  .tool-title { display: flex; align-items: baseline; gap: 6px; }
  .tool .level { font-size: 13px; margin: 0; }
  .tool .bar { margin-top: 8px; }
  .tool .fill, .skill .fill { background: var(--bar-xp); }
  .tool-xp { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats { margin: 12px 0 0; font-size: 13px; }
  .stats div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .upgrade-btn {
    display: block; width: 100%; min-height: 48px; margin-top: 12px; padding: 6px 12px;
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r);
    font: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
    cursor: pointer;
  }
  .upgrade-btn:disabled { color: var(--muted); border-color: var(--line); cursor: default; }
  .upgrade-btn:not(:disabled):active { transform: scale(.98); }
  .cost { display: block; font-size: 12px; font-weight: 500; margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* Hasil aksi muncul di posisi acak di dalam kartu (posisinya diatur dari JS) dan boleh menumpuk.
     Latarnya agak transparan, tapi isi kartu di belakangnya dikaburkan supaya angka tetap terbaca. */
  .pop {
    position: absolute;
    padding: 3px 8px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    font-family: var(--mono);
    pointer-events: none; white-space: nowrap;
    font-size: 14px; font-weight: 700; line-height: 1.2;
    animation: rise 1.6s ease-out forwards;
  }
  @keyframes rise {
    from { transform: translateY(6px); opacity: 0; }
    20% { transform: translateY(0); opacity: 1; }
    70% { opacity: 1; }
    to { transform: translateY(-8px); opacity: 0; }
  }


  /* Desktop: sidebar tetap di kiri dengan grup kegiatan dan level skill, bar atas berisi judul halaman,
     konten melebar dengan grid kartu beberapa kolom. Ponsel tetap memakai drawer. */
  @media (min-width: 900px) {
    :root { --side-w: 232px; --panel-w: 0px; --top-h: 52px; }
    body { padding: var(--top-h) var(--panel-w) 0 var(--side-w); }
    .tabbar, .subtabs { display: none; }
    .top { position: fixed; left: 0; right: 0; top: 0; height: var(--top-h); }
    .topbar { height: var(--top-h); padding: 0 16px; gap: 16px; }
    .brand { display: block; width: 200px; flex: none; font-weight: 700; font-size: 15px; }
    .crumb { flex-direction: row; align-items: baseline; gap: 6px; font-family: var(--mono); }
    .crumb-group { font-size: 12px; }
    .page-title { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink); line-height: inherit; }
    .counter { padding: 5px 9px; }
    /* Sidebar: hanya teks, grup mono, level LV n di kanan */
    .drawer {
      display: block; position: fixed; top: var(--top-h); left: 0; bottom: 0; z-index: 5; width: var(--side-w);
      background: var(--side-bg); border-right: 1px solid var(--line);
      padding: 12px 0 24px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: var(--line-2) transparent;
    }
    .nav-group { display: block; padding: 6px 16px; margin-top: 14px; font-size: 10px; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
    .nav-group:first-child { margin-top: 0; }
    .nav-item {
      position: relative; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding: 0 16px;
      background: none; border: 0; border-radius: 0; text-align: left;
      font: inherit; font-size: 13px; color: #a3a3a3; cursor: pointer;
    }
    .nav-item:hover { background: var(--side-hover); }
    .nav-item[aria-current="page"] { background: var(--side-cur); color: var(--ink); font-weight: 600; }
    .nav-item[aria-current="page"]::before {
      content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--ink);
      animation: nav-line .22s var(--ease-out) both;
    }
    .nav-item:disabled { color: var(--off); cursor: default; }
    .nav-item:disabled:hover { background: none; }
    .nav-name { flex: 1; min-width: 0; }
    .nav-meta { display: flex; align-items: center; gap: 6px; }
    .nav-lv { font-size: 10px; color: var(--muted); }
    .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }

    .app { max-width: none; margin: 0; }
    main { padding: 20px 24px 32px; }
    main > :first-child { margin-top: 0; }

    .tool, .panel { border-radius: var(--r); padding: 18px 20px; }
    .tool .stats { max-width: 440px; }
    .farm-actions { max-width: 520px; }
    .upgrade-btn { display: inline-block; width: auto; min-width: 280px; }
    /* Kartu alat/skill: exp & level di kiri, statistik + tombol upgrade di kanan dengan garis pemisah */
    .tool-split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr); gap: 0 32px; align-items: center; }
    .tool-side { padding-left: 32px; border-left: 1px solid var(--line); align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
    .tool-side > :first-child, .tool-side > [hidden] + * { margin-top: 0; }
    .tool-side .stats { max-width: none; }
    /* Nilai panjang (peluang menang per musuh) turun ke baris sendiri, rata kanan, tanpa mematahkan labelnya */
    .tool-side .stats div { flex-wrap: wrap; column-gap: 12px; }
    .tool-side .stats dt { white-space: nowrap; }
    .tool-side .stats dd { margin-left: auto; }
    .tool-side .upgrade-btn { width: 100%; min-width: 0; }
    .tool-split:has(> .tool-side:not(:has(> :not([hidden])))) { grid-template-columns: 1fr; }
    .tool-side:not(:has(> :not([hidden]))) { display: none; }
    .cards { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { border-radius: var(--r); }
    .card:hover:not(.locked):not(.on) { border-color: var(--muted); }
    .market, .recipes { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
    .items { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
    .plots { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
    .plot-icon { font-size: 30px; }
    .sort { max-width: 420px; }
    .equip { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    #page-settings { max-width: 640px; }

    /* Petualangan: status di kiri, perlengkapan di kanan, kartu penuh; tas, bekal, dan jurnal berdampingan */
    #page-petualangan:not([hidden]) { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
    #page-petualangan > * { margin: 0; }
    #page-petualangan > .tool { grid-column: 1 / 3; }
    #page-petualangan > .equip { grid-column: 3; grid-template-columns: 1fr; align-self: stretch; }
    #page-petualangan > .cards { grid-column: 1 / -1; }
    #page-petualangan .panel .market { grid-template-columns: 1fr; }
    .journal { max-height: 480px; }
  }
  @media (min-width: 900px) and (max-width: 1279px) {
    #page-petualangan:not([hidden]) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #page-petualangan > .tool { grid-column: 1 / -1; }
    #page-petualangan > .equip { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
