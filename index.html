<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<title>Kebon Kosong</title>
<style>
  /* Token monokrom (panel admin). Warna hanya untuk ikon, bar, dan glow item grade tinggi. */
  :root {
    color-scheme: dark;
    --bg: #0a0a0a;
    --card: #111111;
    --panel: #111111;
    --panel-2: #161616;
    --sunken: #0d0d0d;
    --line: #242424;
    --line-2: #2e2e2e;
    --line-strong: #3a3a3a;
    --track: #1f1f1f;
    --ink: #f0f0f0;
    --ink-2: #d4d4d4;
    --muted: #8c8c8c;
    --dim: #5c5c5c;
    --off: #4d4d4d;
    --wood: #c98a55;
    --on-bg: var(--panel-2);
    --on-ink: var(--ink);
    --on-edge: var(--ink);
    --level: #5b9cff;
    --danger: #ff6b5b;
    --side-bg: var(--bg);
    --side-hover: #141414;
    --side-cur: var(--panel-2);
    --bar-action: #6fcf73;
    --bar-xp: #5b9cff;
    --bar-grow: #b8d86b;
    --bar-short: #e0a64f;
    --bar-hp: #e5534b;
    --q-common: #8c8c8c;
    --q-good: #6fcf73;
    --q-great: #5b9cff;
    --q-legend: #f2b544;
    --glow-great: 0 0 10px rgba(91, 156, 255, .28), inset 0 0 8px rgba(91, 156, 255, .12);
    --glow-legend: 0 0 12px rgba(242, 181, 68, .30), inset 0 0 8px rgba(242, 181, 68, .14);
    --r: 6px;
    --r-sm: 4px;
    --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease-out: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-tap-highlight-color: transparent;
    /* ruang untuk tab bar (+ dock aktivitas) yang menempel di bawah */
    padding: 0 0 calc(var(--tabbar-h) + var(--dock-h, 0px) + env(safe-area-inset-bottom));
  }
  :root { --tabbar-h: 62px; --panel-w: 0px; }
  button { font-family: inherit; }
  .mono, .counter, .crumb-group, .nav-group, .nav-lv, .tool-xp, .duration, .item-qty, .plot-time, .cost, .stats dd, .panel-meta, .journal time {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  .caps { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; font-weight: 500; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  .app { max-width: 640px; margin: 0 auto; }
  main { padding: 14px 16px 24px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
  .lock-svg { flex: none; width: 10px; height: 10px; }

  /* ---------- Navigasi ponsel: bar atas + sub-tab (menempel di atas), tab bar di bawah ---------- */
  .top { position: sticky; top: 0; z-index: 6; background: var(--bg); }
  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: max(16px, env(safe-area-inset-top)) 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: none; }
  .top-extra { display: none; flex: none; }
  body[data-page="anvil"] .top-extra { display: block; }
  .crumb { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .crumb-group { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .page-title { font-size: 20px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .counter {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    border: 1px solid var(--line); border-radius: var(--r); padding: 6px 9px;
    font-size: 13px; font-weight: 500; white-space: nowrap;
  }
  .counter-icon { display: inline-block; line-height: 1; }
  .counter-icon.bump { animation: bump .3s ease-out; }
  .subtabs { display: flex; overflow-x: auto; padding: 0 8px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .subtabs::-webkit-scrollbar { display: none; }
  .subtab {
    flex: none; display: flex; align-items: center; gap: 5px; min-height: 44px; padding: 0 10px; margin-bottom: -1px;
    background: none; border: 0; border-bottom: 1px solid transparent; border-radius: 0;
    font: inherit; font-size: 13px; color: #a3a3a3; cursor: pointer;
  }
  .subtab[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .subtab[aria-disabled="true"] { color: var(--dim); cursor: default; }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    border-top: 1px solid var(--line); background: var(--bg);
    padding: 4px 4px max(10px, env(safe-area-inset-bottom));
  }
  .tab {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
    min-height: 48px; padding: 7px 0; background: none; border: 0;
    font: inherit; font-size: 10px; font-weight: 500; color: var(--muted); cursor: pointer;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab[aria-current="page"] { color: var(--ink); font-weight: 600; }
  .tab[aria-current="page"]::before {
    content: ""; position: absolute; top: -5px; left: 22%; right: 22%; height: 1px; background: var(--ink);
    animation: tab-line .3s var(--ease-out) both;
  }
  .tab[aria-disabled="true"] { color: var(--off); cursor: default; }
  .drawer { display: none; }
  @keyframes tab-line { from { transform: scaleX(0); } }
  @keyframes nav-line { from { transform: scaleY(0); } }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes nope { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
  .nope { animation: nope .32s ease-out; }
  @keyframes sel { 35% { transform: scale(.95); } }
  .sel { animation: sel .2s ease-out; }
  .pop-in { animation: pop-in .2s ease-out; }
  .live { animation: blink 1.4s ease-in-out infinite; }

  .items { list-style: none; margin: 0; padding: 0 0 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 20px 8px; }
  .item {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 6px 4px 10px;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--r);
    font: inherit;
    cursor: pointer;
  }
  .item[aria-expanded="true"] { border-color: var(--muted); }
  /* Popup nama item, melayang di atas kotak */
  .tip {
    position: fixed; z-index: 5;
    transform: translate(-50%, -100%);
    padding: 6px 10px;
    background: var(--ink); color: var(--bg);
    border-radius: 8px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
    pointer-events: none;
    animation: tip-in .15s ease-out;
  }
  .tip::after {
    content: ""; position: absolute; left: 50%; top: 100%;
    margin-left: calc(var(--arrow, 0px) - 5px);
    border: 5px solid transparent; border-top-color: var(--ink);
  }
  @keyframes tip-in { from { opacity: 0; transform: translate(-50%, calc(-100% + 4px)); } }
  .item-icon { font-size: 30px; line-height: 1; }
  /* Counter duduk di tengah garis bawah kotak */
  .item-qty {
    position: absolute; left: 50%; bottom: 0;
    transform: translate(-50%, 50%);
    min-width: 28px; padding: 2px 8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 12px; font-weight: 700; line-height: 1.2;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }
  .group { font-size: 12px; font-weight: 600; color: var(--muted); margin: 4px 0 10px; }
  .items + .group { margin-top: 12px; }
  .segment.three { grid-template-columns: repeat(3, 1fr); }
  .sort { margin-bottom: 16px; }
  .tool .fill.full { background: var(--danger); }
  .pop.full { color: var(--danger); }
  .emoji-teak { display: inline-block; filter: brightness(.68) saturate(1.5) hue-rotate(-8deg); }
  .emoji-fish { display: inline-block; }
  .tint { display: inline-block; }
  .tint.mahogany { filter: hue-rotate(-20deg) saturate(1.6) brightness(.8); }
  .tint.ulin { filter: brightness(.45) saturate(.8); }
  .tint.iron { filter: grayscale(.6) brightness(.9); }
  .tint.gold { filter: sepia(1) saturate(3) hue-rotate(5deg) brightness(1.05); }
  .tint.scale { filter: hue-rotate(60deg) saturate(.8); }
  .tint.eel { filter: sepia(.8) brightness(.6); }
  .tint.grouper { filter: sepia(.7) hue-rotate(-20deg) saturate(1.4) brightness(.8); }
  .emoji-fish.carp { filter: sepia(1) saturate(3) hue-rotate(-15deg); }
  .emoji-fish.pangasius { filter: grayscale(.8) brightness(1.1); }
  .emoji-fish.giantSnakehead { filter: hue-rotate(70deg) brightness(.6); }
  .emoji-fish.mackerel { filter: hue-rotate(20deg) saturate(1.4); }
  .emoji-fish.tuna { filter: brightness(.55) saturate(1.3); }
  .emoji-fish.wader { transform: scale(.8); }
  .emoji-fish.tilapia { filter: hue-rotate(150deg) saturate(.7); }
  .emoji-fish.catfish { filter: grayscale(1) brightness(.65); }
  .emoji-fish.snakehead { filter: sepia(1) saturate(2.2) hue-rotate(-25deg) brightness(.75); }


  .skill { margin-top: 12px; }
  .emoji-cooked { display: inline-block; filter: sepia(.6) saturate(1.4) brightness(.8); }
  .emoji-seed { position: relative; display: inline-block; }
  .seed-of { position: absolute; right: -.25em; bottom: -.15em; font-size: .5em; line-height: 1; }

  /* ---------- Kebun: petak monokrom (area ikon + footer), tabel/sheet benih ---------- */
  .chip small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); }
  .chip.selected { background: var(--ink); color: var(--bg); }
  .chip.selected small { color: inherit; opacity: .8; }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 16px 0 8px; }
  .sec-head .caps { font-size: 11px; }
  .plots { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .plot {
    position: relative; width: 100%; aspect-ratio: 1; display: flex; flex-direction: column; padding: 0; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r);
    font: inherit; color: var(--ink); text-align: left; cursor: pointer;
    transition: transform 80ms ease, background-color .15s, border-color .15s;
  }
  .plot:active { transform: scale(.97); }
  .plot-art { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .plot-icon { display: block; font-size: 40px; line-height: 1; transform: scale(var(--s, 1)); transform-origin: 50% 100%; transition: transform .4s ease; }
  .plot-icon svg:not(.emoji) { width: 22px; height: 22px; }
  .plot-foot { border-top: 1px solid var(--line); padding: 6px 8px; }
  .plot-bar { display: block; height: 3px; margin-bottom: 4px; background: var(--track); border-radius: 2px; overflow: hidden; }
  .plot-bar span { display: block; height: 100%; width: 0; background: var(--bar-grow); }
  .plot-time { display: block; font-size: 10px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plot.empty { border-style: dashed; border-color: var(--dim); }
  .plot.empty .plot-icon { color: var(--ink-2); animation: pulse-soft 1.6s ease-in-out infinite; }
  .plot.ready { background: var(--panel-2); border-color: var(--ink); }
  .plot.ready .plot-icon { animation: ripe 1.1s ease-in-out infinite; }
  .plot.ready .plot-time { color: var(--ink); }
  .plot.wilted .plot-icon { filter: grayscale(1); opacity: .6; }
  .plot.buy { background: var(--sunken); border: 1px dashed var(--line-2); }
  .plot.buy .plot-icon { color: var(--off); }
  .plot.buy .plot-icon svg { width: 16px; height: 16px; }
  .plot.buy.armed { border-color: var(--danger); }
  .plot.buy.armed .plot-time { color: var(--danger); }
  .plot.harvest { animation: harvest .3s ease-out; }
  .plot-pop { left: 0; right: 0; top: 12px; margin: 0 auto; width: max-content; }
  @keyframes pulse-soft { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes ripe { 50% { transform: translateY(-3px); } }
  @keyframes harvest { 0% { border-color: var(--ink); } 30% { transform: scale(1.05); } }
  .farm-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn2 {
    flex: 1; min-height: 44px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r);
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .btn2:disabled { color: var(--dim); border-color: var(--line); cursor: default; }
  .note { margin: 8px 0 0; font-family: var(--mono); font-size: 11px; color: var(--dim); }
  /* Baris benih (dipakai sheet ponsel dan tabel desktop) */
  .seed-row {
    width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) 56px 64px 48px; align-items: center; gap: 12px;
    min-height: 52px; padding: 8px 16px; background: transparent; border: 0; border-bottom: 1px solid var(--line);
    font: inherit; font-size: 14px; color: var(--ink); text-align: left; cursor: pointer;
  }
  .seed-row:last-child { border-bottom: 0; }
  .seed-row > :nth-child(n+3) { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .seed-row > :nth-child(4) { color: var(--ink); }
  .seed-ic { font-size: 26px; line-height: 1; }
  .seed-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seed-name small { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 4px; }
  .seed-row.off { color: var(--dim); cursor: default; }
  .seed-row.off > * { color: var(--dim) !important; }
  .seed-row.off .seed-ic { filter: grayscale(1); opacity: .45; }
  .seed-row:not(.off):not(.seed-th):hover { background: var(--panel-2); }
  .seed-row.cur .seed-name { font-weight: 700; }
  .seed-th { min-height: 0; padding-top: 9px; padding-bottom: 9px; cursor: default; }
  .seed-th > * { font-family: var(--mono); font-size: 10px !important; color: var(--dim) !important; letter-spacing: .06em; text-transform: uppercase; }
  .seed-table { display: none; margin-top: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .seed-note { display: none; }
  .row-in { animation: row-in .24s var(--ease-out) both; animation-delay: calc(60ms + var(--i, 0) * 40ms); }
  @keyframes row-in { from { opacity: 0; transform: translateX(-8px); } }
  /* Bottom sheet benih (ponsel) */
  .sheet-scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .7); animation: fade .18s ease-out; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 80dvh; overflow-y: auto;
    background: var(--panel); border-top: 1px solid var(--line-strong); padding-bottom: max(24px, env(safe-area-inset-bottom));
    animation: sheet-up .25s var(--ease-out);
  }
  .sheet .side-head { padding: 12px 16px; }
  @keyframes sheet-up { from { transform: translateY(100%); } }
  @keyframes fade { from { opacity: 0; } }
  /* Strip "Berikutnya": rantai 4 langkah loop pertama */
  .next-strip { margin-bottom: 12px; }
  .next-chain { display: flex; align-items: center; justify-content: space-between; padding: 12px; }
  .next-step { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: var(--r); font-size: 22px; line-height: 1; }
  .next-step.cur { border-color: var(--ink); }
  .next-step.todo { border-style: dashed; }
  .next-step.todo > .ni { filter: grayscale(1); opacity: .45; }
  .next-step.done > .ni { opacity: .8; }
  .next-check { position: absolute; right: -5px; top: -5px; width: 14px; height: 14px; border-radius: 3px; background: var(--ink); display: grid; place-items: center; }
  .next-check svg { width: 9px; height: 9px; }
  .next-arrow { width: 12px; height: 12px; color: var(--off); }
  .next-text {
    display: flex; width: 100%; justify-content: space-between; gap: 8px; padding: 0 12px 12px; background: none; border: 0;
    font: inherit; font-size: 13px; color: var(--ink-2); text-align: left; cursor: pointer;
  }
  .next-text .mono { color: var(--muted); font-size: 12px; }
  .side-panel .next-strip { margin: 0; }
  .side-panel .next-step { width: 36px; height: 36px; font-size: 20px; }
  @media (min-width: 1280px) { #page-kebun > .next-strip, #page-hutan > .next-strip { display: none; } }
  .shop { margin: 0 0 16px; }
  /* Kualitas tempa: warna nama + bingkai kotak item */
  .q-good { --q: var(--q-good); } .q-great { --q: var(--q-great); } .q-legend { --q: var(--q-legend); }
  /* Glow tipis hanya untuk Istimewa & Pusaka di kotak inventori */
  .item.q-great { border-color: rgba(91, 156, 255, .55); box-shadow: var(--glow-great); }
  .item.q-legend { border-color: rgba(242, 181, 68, .6); box-shadow: var(--glow-legend); }
  .sell-name.q-good, .sell-name.q-great, .sell-name.q-legend, .equip-name.q-good, .equip-name.q-great, .equip-name.q-legend,
  .chip.q-good, .chip.q-great, .chip.q-legend { color: var(--q); }
  .tool .fill.hp { background: var(--bar-hp); }
  .tool .fill.hp.low { background: var(--danger); }
  .stats dd { text-align: right; }

  .equip { display: grid; gap: 8px; margin-bottom: 12px; }
  .equip-slot { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
  .equip-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
  .equip-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; min-height: 24px; }
  .equip-toggle {
    display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 8px; margin-right: -6px;
    background: none; border: 0; border-radius: 6px;
    font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .equip-toggle:hover { background: var(--track); }
  .caret { width: 7px; height: 7px; border: solid currentColor; border-width: 0 2px 2px 0; transform: translateY(-2px) rotate(45deg); transition: transform .15s; }
  .equip-toggle[aria-expanded="true"] .caret { transform: translateY(1px) rotate(-135deg); }
  .equip-cur { display: flex; align-items: center; gap: 10px; min-height: 32px; }
  .equip-icon { font-size: 26px; line-height: 1; }
  .equip-name { flex: 1; font-weight: 600; font-size: 14px; }
  .equip-name small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .equip-none { color: var(--muted); font-size: 14px; }
  .equip-options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    min-height: 32px; padding: 0 10px;
    background: var(--track); border: 0; border-radius: var(--r-sm);
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .chip:disabled, .sell-btn:disabled, .notice-btn:disabled { opacity: .5; cursor: default; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-top: 12px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .panel-title { font-weight: 700; }
  .panel-title .level { display: inline; font-size: 12px; }
  .panel-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .panel-hint { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }
  .panel .sell-row { padding: 8px 10px; }
  .panel .notice-btn { margin-top: 10px; }
  .journal { list-style: none; margin: 0; padding: 0; font-size: 13px; max-height: 320px; overflow-y: auto; }
  .journal li { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); }
  .journal li:first-child { border-top: 0; }
  .journal time { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
  .journal .j-lose, .journal .j-home, .journal .j-bagFull { color: var(--danger); }
  .journal .j-start, .journal .j-stop { font-weight: 600; }
  .skill .level { display: block; }
  .skill .bar { margin-top: 4px; }

  /* ---------- Anvil: kartu resep (meter bahan, peluang kualitas, tombol tempa / baris tujuan, hasil) ---------- */
  .recipes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; align-items: start; }
  .recipe { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
  .recipe.ready { border-color: var(--line-strong); }
  .r-head { display: flex; align-items: center; gap: 10px; padding: 12px; }
  .ibox { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: var(--r); font-size: 26px; line-height: 1; }
  .ibox.old { border-color: var(--line); filter: grayscale(1); opacity: .5; }
  .r-arrow { flex: none; width: 14px; height: 14px; color: var(--dim); }
  .r-info { flex: 1; min-width: 0; }
  .r-name { font-weight: 600; font-size: 15px; }
  .r-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 3px; font-size: 12px; color: var(--ink-2); }
  .r-sub .caps { font-size: 10px; }
  .r-tier { flex: none; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .r-sec { border-top: 1px solid var(--line); padding: 10px 12px; }
  .r-sec:empty { display: none; }
  .mats { display: flex; flex-direction: column; gap: 8px; }
  .mat { display: flex; align-items: center; gap: 10px; }
  .mat-ic { flex: none; width: 20px; font-size: 16px; line-height: 1; text-align: center; }
  .mat .bar { flex: 1; height: 4px; }
  .mat .fill.short { background: var(--bar-short); }
  .mat-n { flex: none; min-width: 76px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mat.ok .mat-n { color: var(--ink-2); }
  .odds-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .odds-bar { display: flex; gap: 2px; height: 4px; }
  .odds-bar > span:nth-child(1) { background: var(--q-common); }
  .odds-bar > span:nth-child(2) { background: var(--q-good); }
  .odds-bar > span:nth-child(3) { background: var(--q-great); }
  .odds-bar > span:nth-child(4) { background: var(--q-legend); min-width: 3px; }
  .r-act { display: flex; align-items: center; gap: 12px; }
  .forge-btn {
    flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 12px;
    background: var(--ink); border: 1px solid var(--ink); border-radius: var(--r);
    font: inherit; font-size: 14px; font-weight: 600; color: var(--bg); cursor: pointer;
  }
  .forge-btn .mono { font-size: 11px; opacity: .6; }
  .forge-btn:disabled { background: var(--panel-2); border-color: var(--line-strong); color: var(--muted); cursor: default; }
  .goal {
    display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 12px;
    background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0 0 var(--r) var(--r);
    font: inherit; font-size: 13px; color: var(--ink-2); text-align: left; cursor: pointer;
  }
  .goal > span:first-child { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .goal .mono { color: var(--muted); }
  .goal:disabled { cursor: default; color: var(--muted); }
  .goal:not(:disabled):hover { background: var(--panel-2); }
  /* Animasi tempa: palu memukul 3×, percikan, anvil turun sedikit */
  .forge-art { position: relative; flex: none; width: 48px; height: 44px; }
  .anvil-ic { position: absolute; left: 4px; bottom: 2px; width: 38px; height: 26px; }
  .anvil-ic svg { width: 100%; height: 100%; }
  .hammer { position: absolute; left: 18px; top: -6px; font-size: 22px; line-height: 1; transform: rotate(-35deg); transform-origin: 80% 85%; }
  .spark { position: absolute; left: 22px; top: 16px; width: 4px; height: 4px; border-radius: 50%; background: #f2c94c; opacity: 0; }
  .forging .hammer { animation: strike .45s ease-in-out 3; }
  .forging .anvil-ic { animation: thud .45s ease-in-out 3; }
  .forging .spark { animation: spark .45s ease-out 3; }
  @keyframes strike { 0%, 100% { transform: rotate(-35deg); } 50% { transform: rotate(12deg); } }
  @keyframes thud { 55% { transform: translateY(1.5px); } }
  @keyframes spark { 0%, 45% { opacity: 0; transform: none; } 50% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(.3); } }
  .forge-res { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: var(--r); animation: pop-in .22s ease-out; }
  .forge-res .res-ic { font-size: 20px; line-height: 1; }
  .forge-res .res-name { flex: 1; min-width: 0; font-size: 13px; }
  .forge-res .res-name small { display: block; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .forge-res .res-tag { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; color: var(--ink-2); text-transform: uppercase; }
  .q-dot { width: 6px; height: 6px; border-radius: 1px; background: var(--q, var(--q-common)); }
  .forge-res.fail .res-tag { color: var(--muted); }
  .forge-res.q-great { border-color: rgba(91, 156, 255, .55); box-shadow: var(--glow-great); }
  .forge-res.q-legend { border-color: rgba(242, 181, 68, .6); box-shadow: var(--glow-legend); }
  .forge-res.q-great, .forge-res.q-legend { animation: pop-in .22s ease-out, shimmer 2.4s ease-in-out infinite; }
  @keyframes shimmer { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
  .anvil-up { margin-bottom: 12px; }
  .later { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: var(--r); }
  .later .ic { font-size: 22px; line-height: 1; filter: grayscale(1); opacity: .5; }
  .seg { display: flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
  .seg button { min-height: 32px; padding: 0 12px; background: none; border: 0; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button[aria-pressed="true"] { background: var(--track); color: var(--ink); font-weight: 600; }
  .notice {
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r);
    padding: 12px 14px; margin-bottom: 12px;
  }
  .notice-title { display: block; font-weight: 600; font-size: 14px; color: var(--ink); }
  .notice-list { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 8px 0 10px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .notice-btn {
    min-height: 32px; padding: 0 12px;
    background: var(--track); border: 0; border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer;
  }

  .market { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .sell-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 10px 12px;
  }
  .sell-icon { flex: none; font-size: 28px; line-height: 1; }
  .sell-info { flex: 1; min-width: 0; }
  .sell-name { display: block; font-weight: 600; font-size: 14px; }
  .sell-meta { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sell-btn {
    flex: none; min-height: 36px; padding: 0 10px;
    background: var(--track); border: 0; border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
    cursor: pointer; white-space: nowrap;
  }
  .sell-btn:active { transform: scale(.97); }
  .sell-btn.confirm { border-color: var(--danger); color: var(--danger); }

  .setting {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .setting-label { display: block; font-weight: 600; margin-bottom: 10px; }
  .segment { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--track); border-radius: var(--r); padding: 4px; }
  .segment button {
    min-height: 36px;
    background: none; border: 0; border-radius: 7px;
    font: inherit; font-size: 14px; color: var(--muted);
    cursor: pointer;
  }
  .reset-btn {
    width: 100%; min-height: 40px;
    background: none; border: 1.5px solid var(--danger); border-radius: var(--r);
    font: inherit; font-size: 14px; font-weight: 600; color: var(--danger);
    cursor: pointer;
  }
  .reset-btn.confirm { background: var(--panel-2); }
  .segment button[aria-pressed="true"] { background: var(--track); color: var(--ink); font-weight: 600; }

  /* ---------- Kartu kegiatan (node, resep, petualangan) ---------- */
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .card-wrap { position: relative; min-width: 0; }
  .card {
    position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; padding: 0; overflow: hidden;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); border-radius: var(--r);
    font: inherit; text-align: left; cursor: pointer;
    transition: transform 80ms ease, background-color .15s, border-color .15s;
  }
  .card:active { transform: scale(.97); }
  .card.on { background: var(--panel-2); border-color: var(--ink); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  .card .name { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-tag { flex: none; font-family: var(--mono); font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card.on .card-tag { color: var(--ink); }
  .card-art { position: relative; height: 96px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
  .card .icon { display: block; font-size: 52px; line-height: 1; transform-origin: 50% 92%; }
  .card-foot { padding: 0 10px 10px; margin-top: auto; }
  .card .bar { height: 4px; margin: 0; border-radius: 2px; }
  .card-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; min-height: 14px; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .card .duration { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drops { display: flex; gap: 3px; font-size: 13px; line-height: 1; }
  .node-xp { flex: none; width: 28px; height: 2px; background: var(--track); border-radius: 1px; overflow: hidden; }
  .node-xp span { display: block; height: 100%; width: 0; background: var(--bar-xp); }
  .card .inputs { display: block; padding: 0 10px 8px; font-size: 11px; color: var(--muted); line-height: 1.5; font-family: var(--mono); }
  .card.locked { background: var(--sunken); border-style: dashed; cursor: default; }
  .card.locked:active { transform: none; }
  .card.locked .name { color: #6b6b6b; }
  .card.locked .icon { filter: grayscale(1) brightness(.5); opacity: .5; }
  .card.locked .bar { background: var(--panel-2); }
  .card.locked .card-meta > :not(.duration) { visibility: hidden; }
  .card.locked .duration { color: var(--dim); }
  .lock-chip {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 4px; white-space: nowrap;
    background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 3px 7px 3px 5px;
    font-family: var(--mono); font-size: 10px; color: var(--muted);
  }
  .card.locked .lock-chip { display: inline-flex; }
  .lock-chip .ci { font-size: 14px; line-height: 1; }
  /* Petunjuk kunci: menutupi kartu, menunjukkan jalan ke syaratnya */
  .lock-hint {
    position: absolute; inset: 0; z-index: 2; border-radius: var(--r); border: 1px dashed var(--line-2);
    background: rgba(10, 10, 10, .96);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px;
    text-align: center; cursor: pointer; animation: pop-in .18s ease-out;
  }
  .hint-path { display: flex; align-items: center; gap: 8px; font-size: 26px; line-height: 1; }
  .hint-path svg { width: 26px; height: 26px; }
  .hint-path .arrow { width: 14px; height: 14px; color: var(--dim); }
  .hint-text { font-size: 12px; color: var(--ink-2); }
  .hint-go {
    min-height: 32px; padding: 0 12px; background: none; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
    font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  @keyframes pop-in { from { opacity: 0; transform: translateY(6px); } }
  /* Bar petunjuk area terkunci (klik sub-tab/sidebar yang terkunci) */
  .lock-bar {
    display: flex; align-items: center; gap: 10px; margin: 10px 16px 0; padding: 8px 8px 8px 12px;
    background: var(--panel); border: 1px dashed var(--line-strong); border-radius: var(--r);
    font-size: 13px; color: var(--ink-2); animation: pop-in .18s ease-out;
  }
  .lock-bar .lock-chip { position: static; transform: none; display: inline-flex; }
  .lock-bar .hint-text { flex: 1; min-width: 0; }

  .level { display: block; font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .name { display: block; font-size: 15px; font-weight: 600; }
  .duration { display: block; font-size: 12px; color: var(--muted); }
  .icon { display: block; font-size: 40px; line-height: 1; }
  svg.emoji { width: 1em; height: 1em; vertical-align: -0.125em; }
  .pop.miss { color: var(--muted); }
  .icon.bump, .card .icon.shake { animation: shake .35s ease-out; }
  @keyframes bump { 40% { transform: scale(1.22); } }
  @keyframes shake { 25% { transform: rotate(-6deg); } 55% { transform: rotate(4deg); } 80% { transform: rotate(-2deg); } }

  .bar { display: block; height: 6px; background: var(--track); border-radius: 2px; overflow: hidden; }
  .fill { display: block; height: 100%; width: 0%; background: var(--bar-action); border-radius: inherit; }

  /* ---------- Baris alat / skill: kotak LV + nama + tier + exp ---------- */
  .tool { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 12px; }
  .tool-row { display: flex; align-items: center; gap: 12px; }
  .lv-box {
    flex: none; width: 44px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid var(--line-strong); border-radius: var(--r);
  }
  .lv-box span { font-family: var(--mono); font-size: 9px; color: var(--muted); }
  .lv-box b { font-family: var(--mono); font-size: 18px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .tool-main { flex: 1; min-width: 0; }
  .tool-title { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .tool-title .tool-icon { font-size: 16px; line-height: 1; align-self: center; }
  .tool-title .name { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool-title .tier { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .tool-title .tool-xp { margin: 0 0 0 auto; flex: none; }
  .tool .bar { margin-top: 8px; }
  .tool .fill, .skill .fill, .fill.xp { background: var(--bar-xp); }
  .tool-xp { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .tool-top { display: flex; gap: 14px; align-items: center; }
  .tool-top > .tool-icon { flex: none; font-size: 36px; line-height: 1; }
  .tool .level { font-size: 11px; margin: 0; }
  .tool-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .tool-foot:not(:has(> :not([hidden]))) { display: none; }
  .tool-foot .stats { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; }
  .tool-foot .stats div { padding: 0; gap: 6px; }
  .tool-link { background: none; border: 0; padding: 4px 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  .stats { margin: 12px 0 0; font-size: 13px; }
  .stats div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; font-weight: 600; }
  .upgrade-btn {
    display: block; width: 100%; min-height: 48px; margin-top: 12px; padding: 6px 12px;
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r);
    font: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
    cursor: pointer;
  }
  .upgrade-btn:disabled { color: var(--muted); border-color: var(--line); cursor: default; }
  .upgrade-btn:not(:disabled):active { transform: scale(.98); }
  .cost { display: block; font-size: 12px; font-weight: 500; margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* Hasil aksi muncul di posisi acak di dalam kartu (posisinya diatur dari JS) dan boleh menumpuk.
     Latarnya agak transparan, tapi isi kartu di belakangnya dikaburkan supaya angka tetap terbaca. */
  .pop {
    position: absolute;
    padding: 3px 8px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    font-family: var(--mono);
    pointer-events: none; white-space: nowrap;
    font-size: 11px; font-weight: 600; line-height: 1.3; display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px 2px 4px;
    animation: rise .95s ease-out forwards; z-index: 1;
  }
  @keyframes rise {
    from { transform: translateY(6px); opacity: 0; }
    20% { transform: translateY(0); opacity: 1; }
    70% { opacity: 1; }
    to { transform: translateY(-8px); opacity: 0; }
  }



  /* ---------- Aktivitas: dock ponsel (di atas tab bar), strip di atas konten (900–1279), panel kanan (≥1280) ---------- */
  .dock { position: fixed; left: 10px; right: 10px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 8px); z-index: 7;
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; animation: dock-in .22s var(--ease-out); }
  body.has-dock { --dock-h: 60px; }
  .act-row { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; }
  .act-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  .act-main { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .act-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .act-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .act-stop { flex: none; width: 44px; height: 36px; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--r-sm); cursor: pointer; }
  .act-stop span { width: 12px; height: 12px; border-radius: 2px; background: var(--ink); }
  .act-bar { height: 3px; background: var(--track); }
  .act-bar .fill { border-radius: 0; }
  .act-idle { padding: 12px; font-family: var(--mono); font-size: 12px; color: var(--dim); }
  @keyframes dock-in { from { opacity: 0; transform: translateY(20px); } }
  .side-panel { display: none; }
  .side-box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .side-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .side-head .live { color: var(--ink); }
  @media (min-width: 900px) {
    body.has-dock { --dock-h: 0px; }
    .dock { position: sticky; top: calc(var(--top-h) + 8px); left: auto; right: auto; bottom: auto; margin: 16px 24px -4px; }
    .act-main { flex-direction: column; gap: 2px; }
  }
  /* ---------- Rumah / Tas / Pasar / Dapur / Petualangan / Pengaturan: pola yang sama ---------- */
  /* Kotak item: ikon berwarna, jumlah mono di kanan bawah; glow tipis hanya untuk Istimewa & Pusaka */
  .items { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; padding: 0 0 12px; }
  .item { display: grid; place-items: center; gap: 0; padding: 0; background: transparent; border: 1px solid var(--line-2); border-radius: var(--r); }
  .item[aria-expanded="true"] { border-color: var(--ink); }
  .item-icon { font-size: 28px; }
  .item-qty {
    left: auto; right: 4px; bottom: 2px; transform: none; min-width: 0; padding: 0;
    background: none; border: 0; border-radius: 0; font-size: 10px; font-weight: 500; color: var(--ink-2);
  }
  .item.zero { opacity: .35; }
  .item.q-great, .item.q-legend, .forge-res.q-great, .forge-res.q-legend { box-shadow: none; border-color: var(--line-2); animation: pop-in .22s ease-out; }
  .item.q-great::after, .item.q-legend::after, .forge-res.q-great::after, .forge-res.q-legend::after {
    content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; animation: shimmer 2.4s ease-in-out infinite;
  }
  .forge-res { position: relative; }
  .item.q-great::after, .forge-res.q-great::after { border: 1px solid rgba(91, 156, 255, .55); box-shadow: var(--glow-great); }
  .item.q-legend::after, .forge-res.q-legend::after { border: 1px solid rgba(242, 181, 68, .6); box-shadow: var(--glow-legend); }
  .item { animation: none; }
  .group { font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 4px 0 8px; }
  .tip { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-sm); font-weight: 500; }
  .tip::after { border-top-color: var(--line-strong); }
  .tip-name { font-weight: 600; }
  .tip-name.q-good, .tip-name.q-great, .tip-name.q-legend { color: var(--q); }
  .tip-meta { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .sort { margin-bottom: 14px; display: inline-flex; }
  .empty { color: var(--muted); font-size: 13px; margin: 0; padding: 12px; }
  .notice { margin-bottom: 12px; border-style: dashed; }
  .notice-btn { min-height: 36px; padding: 0 12px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r-sm); }
  /* Tingkat kualitas di nama: kotak kecil warna tier (nama sendiri tetap putih) */
  .sell-name.q-good, .sell-name.q-great, .sell-name.q-legend, .equip-name.q-good, .equip-name.q-great, .equip-name.q-legend,
  .chip.q-good, .chip.q-great, .chip.q-legend { color: inherit; }
  .sell-name[class*="q-"]:not(.q-common)::after, .equip-name[class*="q-"]:not(.q-common) > b::after, .chip[class*="q-"]:not(.q-common)::after {
    content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 1px; background: var(--q); vertical-align: middle;
  }
  /* Panel + baris tabel bergaris: ikon · nama · meta mono · tombol sekunder */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 0; margin: 0 0 12px; overflow: hidden; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .panel-head .caps:last-child:not(:first-child) { text-align: right; }
  .panel-hint { font-size: 12px; color: var(--muted); margin: 0; padding: 8px 12px 0; }
  .panel > .notice-btn, .panel > .upgrade-btn { margin: 10px 12px 12px; width: calc(100% - 24px); }
  .panel > .notice-btn + .upgrade-btn { margin-top: 0; }
  .market { display: block; list-style: none; margin: 0; padding: 0; }
  .sell-row { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
  .market > .sell-row:last-child { border-bottom: 0; }
  .panel .sell-row { padding: 6px 12px; }
  .sell-icon { font-size: 24px; }
  .sell-name { font-weight: 500; font-size: 14px; }
  .sell-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .sell-btn { min-height: 36px; min-width: 44px; padding: 0 10px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r-sm); font-size: 12px; }
  .sell-btn:disabled { opacity: 1; color: var(--dim); border-color: var(--line); }
  .upgrade-btn { min-height: 44px; }
  .upgrade-btn .cost { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 500; }
  /* Jurnal: daftar mono kecil, waktu redup */
  .journal { font-size: 12px; padding: 4px 12px 8px; }
  .journal li { border-top-color: var(--line); }
  .journal time { color: var(--dim); font-size: 11px; }
  .journal .j-lose, .journal .j-home, .journal .j-bagFull { color: var(--ink-2); }
  .journal .j-lose time + span::before, .journal .j-home time + span::before { content: "− "; color: var(--danger); }
  .journal .j-start, .journal .j-stop { font-weight: 600; }
  /* Petualangan: HP & skill sebagai bar */
  .adv-status .hp-head { display: flex; justify-content: space-between; align-items: baseline; }
  .adv-status .hp-bar { margin: 6px 0 4px; }
  .tool .fill.hp { background: var(--bar-hp); }
  .tool .fill.hp.low { background: var(--danger); }
  .adv-skill { margin-top: 12px; }
  .adv-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; }
  .adv-stats dd { font-family: var(--mono); }
  .equip-slot { background: var(--panel); border-radius: var(--r); }
  .equip-label { font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .chip { min-height: 32px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r-sm); font-size: 12px; }
  .chip:disabled { opacity: 1; color: var(--dim); border-color: var(--line); }
  /* Pengaturan: baris label + segmented control */
  .setting { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 8px; }
  .setting-label { margin: 0; font-size: 14px; font-weight: 500; }
  .setting .reset-btn { width: auto; min-height: 36px; padding: 0 12px; font-size: 13px; border-width: 1px; border-radius: var(--r-sm); }
  .seg button { min-height: 36px; }
  /* Panel kanan: isi Rumah ringkas */
  .note.pad { margin: 0; padding: 8px 12px 10px; border-top: 1px solid var(--line); }
  .card .inputs { display: flex; flex-direction: column; gap: 6px; padding: 0 10px 10px; }
  .card .inputs .mat-n { min-width: 56px; }
  .card .inputs .mat-ic { font-size: 14px; }
  .house-fill-short, .fill.short { background: var(--bar-short); }
  .side-items { grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 12px; }
  .side-items .item-icon { font-size: 22px; }
  .side-items .more { display: grid; place-items: center; aspect-ratio: 1; font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px dashed var(--line-2); border-radius: var(--r); background: none; cursor: pointer; }
  /* Desktop: sidebar tetap di kiri dengan grup kegiatan dan level skill, bar atas berisi judul halaman,
     konten melebar dengan grid kartu beberapa kolom. Ponsel tetap memakai drawer. */
  @media (min-width: 900px) {
    :root { --side-w: 232px; --top-h: 52px; }
    body { padding: var(--top-h) var(--panel-w) 0 var(--side-w); }
    .tabbar, .subtabs { display: none; }
    .top { position: fixed; left: 0; right: 0; top: 0; height: var(--top-h); }
    .topbar { height: var(--top-h); padding: 0 16px; gap: 16px; }
    .brand { display: block; width: 200px; flex: none; font-weight: 700; font-size: 15px; }
    .crumb { flex-direction: row; align-items: baseline; gap: 6px; font-family: var(--mono); }
    .crumb-group { font-size: 12px; }
    .page-title { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink); line-height: inherit; }
    .counter { padding: 5px 9px; }
    /* Sidebar: hanya teks, grup mono, level LV n di kanan */
    .drawer {
      display: block; position: fixed; top: var(--top-h); left: 0; bottom: 0; z-index: 5; width: var(--side-w);
      background: var(--side-bg); border-right: 1px solid var(--line);
      padding: 12px 0 24px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: var(--line-2) transparent;
    }
    .nav-group { display: block; padding: 6px 16px; margin-top: 14px; font-size: 10px; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
    .nav-group:first-child { margin-top: 0; }
    .nav-item {
      position: relative; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding: 0 16px;
      background: none; border: 0; border-radius: 0; text-align: left;
      font: inherit; font-size: 13px; color: #a3a3a3; cursor: pointer;
    }
    .nav-item:hover { background: var(--side-hover); }
    .nav-item[aria-current="page"] { background: var(--side-cur); color: var(--ink); font-weight: 600; }
    .nav-item[aria-current="page"]::before {
      content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--ink);
      animation: nav-line .22s var(--ease-out) both;
    }
    .nav-item[aria-disabled="true"] { color: var(--off); cursor: default; }
    .nav-item[aria-disabled="true"]:hover { background: none; }
    .nav-name { flex: 1; min-width: 0; }
    .nav-meta { display: flex; align-items: center; gap: 6px; }
    .nav-lv { font-size: 10px; color: var(--muted); }
    .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }

    .app { max-width: none; margin: 0; }
    main { padding: 20px 24px 32px; }
    main > :first-child { margin-top: 0; }

    .tool, .panel { border-radius: var(--r); padding: 18px 20px; }
    /* Kartu alat/skill: exp & level di kiri, statistik + tombol upgrade di kanan dengan garis pemisah */
    .tool-split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr); gap: 0 32px; align-items: center; }
    .tool-side { padding-left: 32px; border-left: 1px solid var(--line); align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
    .tool-side > :first-child, .tool-side > [hidden] + * { margin-top: 0; }
    .tool-side .stats { max-width: none; }
    /* Nilai panjang (peluang menang per musuh) turun ke baris sendiri, rata kanan, tanpa mematahkan labelnya */
    .tool-side .stats div { flex-wrap: wrap; column-gap: 12px; }
    .tool-side .stats dt { white-space: nowrap; }
    .tool-side .stats dd { margin-left: auto; }
    .tool-side .upgrade-btn { width: 100%; min-width: 0; }
    .tool-split:has(> .tool-side:not(:has(> :not([hidden])))) { grid-template-columns: 1fr; }
    .tool-side:not(:has(> :not([hidden]))) { display: none; }
    .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .card:hover:not(.locked):not(.on) { border-color: var(--line-strong); }
    .card-head { padding: 10px 12px; }
    .card .name { font-size: 14px; }
    .card-art { height: 130px; }
    .card .icon { font-size: 72px; }
    .card-foot { padding: 0 12px 12px; }
    .lock-bar { margin: 16px 24px -4px; }
    .tool { padding: 12px 14px; }
    .lv-box { width: 48px; height: 48px; }
    .lv-box b { font-size: 20px; }
    .recipes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #page-pasar:not([hidden]) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 16px; align-items: start; }
    .items { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
    .plots { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
    .farm-actions { max-width: 420px; }
    .seed-table { display: block; }
    .seed-note { display: block; }
    .equip { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    #page-settings { max-width: 640px; }

    /* Petualangan: status di kiri, perlengkapan di kanan, kartu penuh; tas, bekal, dan jurnal berdampingan */
    #page-petualangan:not([hidden]) { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
    #page-petualangan > * { margin: 0; }
    #page-petualangan > .tool { grid-column: 1 / 3; }
    #page-petualangan > .equip { grid-column: 3; grid-template-columns: 1fr; align-self: stretch; }
    #page-petualangan > .cards { grid-column: 1 / -1; }
    #page-petualangan .panel .market { grid-template-columns: 1fr; }
    .journal { max-height: 480px; }
  }
  @media (min-width: 900px) and (max-width: 1279px) {
    #page-petualangan:not([hidden]) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #page-petualangan > .tool { grid-column: 1 / -1; }
    #page-petualangan > .equip { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; }
  }
  /* ≥1280: panel kanan tampil; harus paling akhir supaya menang atas aturan 900px */
  @media (min-width: 1280px) {
    :root { --panel-w: 300px; }
    .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .dock { display: none; }
    .side-panel {
      display: flex; flex-direction: column; gap: 14px; position: fixed; top: var(--top-h); right: 0; bottom: 0; z-index: 5; width: var(--panel-w);
      padding: 16px; border-left: 1px solid var(--line); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent;
    }
    .side-panel .act-stop { width: 36px; height: 32px; }
    .side-panel .side-items { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div class="top">
  <header class="topbar">

  </main>

  <main id="page-laut" hidden>

  </main>

        <span class="bar"><span class="fill" id="cooking-fill"></span></span></div></div>

    </section>

    <div class="cards" data-area="dapur"></div>
  </main>

  <main id="page-petualangan" hidden>

        <div class="tool-title"><span class="name" data-i18n="armorSkill"></span><span class="tool-xp" id="armor-xp"></span></div>
        <span class="bar"><span class="fill" id="armor-fill"></span></span></div></div>

        <div><dt data-i18n="interval"></dt><dd id="adv-interval"></dd></div>

    <div class="cards" data-area="petualangan"></div>

    <section class="panel">

      <div class="panel-head"><span class="caps" data-i18n="pack"></span></div>

      <ul class="market" id="pack"></ul>

    <section class="panel">

        <button data-lang-choice="en">English</button>

    <div class="setting">

      <div class="seg">
