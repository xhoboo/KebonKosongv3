<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<title>Kebon Kosong</title>
<script>
  // Pasang tema sebelum halaman digambar supaya tidak berkedip
  (function () {
    let theme = null;
    try { theme = JSON.parse(localStorage.getItem('kebon-kosong-settings')).theme; } catch {}
    if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  :root {
    --bg: #f3efe6;
    --card: #fffdf8;
    --ink: #2a2620;
    --muted: #7a7266;
    --line: #e4ddcf;
    --track: #ebe5d8;
    --wood: #a0673a;
    --on-bg: #3f7d4e;
    --on-ink: #ffffff;
    --on-edge: #2b5a37;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #141a16;
    --card: #1d2520;
    --ink: #ece7dc;
    --muted: #9a9486;
    --line: #2c3530;
    --track: #2a332d;
    --wood: #c98a55;
    --on-bg: #2f6b3e;
    --on-ink: #eaf5ec;
    --on-edge: #1c4227;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .app { max-width: 480px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 16px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
  .menu-btn {
    width: 40px; height: 40px; margin-right: -8px;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 10px;
    color: var(--ink); cursor: pointer;
  }
  .menu-btn:active { background: var(--track); }

  .scrim {
    position: fixed; inset: 0; z-index: 10;
    background: transparent;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .drawer {
    position: fixed; top: 0; bottom: 0; right: 0; z-index: 11;
    width: min(260px, 75vw);
    background: var(--card);
    border-left: 1px solid var(--line);
    padding: max(16px, env(safe-area-inset-top)) 12px 16px;
    transform: translateX(100%);
    visibility: hidden;
    transition: transform .25s ease, visibility .25s;
  }
  body.menu-open .scrim { opacity: 1; pointer-events: auto; }
  body.menu-open .drawer { transform: none; visibility: visible; }
  .drawer .brand { font-weight: 700; padding: 10px 12px 16px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 12px;
    background: none; border: 0; border-radius: 10px;
    font: inherit; font-size: 15px; color: var(--ink); text-align: left;
    cursor: pointer;
  }
  .nav-item:active { background: var(--track); }
  .nav-item[aria-current="page"] { background: var(--track); font-weight: 600; }

  .items { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
  .item {
    aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .item-icon { font-size: 30px; line-height: 1; }
  .item-qty { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }

  .setting {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .setting-label { display: block; font-weight: 600; margin-bottom: 10px; }
  .segment { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--track); border-radius: 10px; padding: 4px; }
  .segment button {
    min-height: 36px;
    background: none; border: 0; border-radius: 7px;
    font: inherit; font-size: 14px; color: var(--muted);
    cursor: pointer;
  }
  .segment button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    position: relative;
    display: block;
    width: 100%;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    font: inherit;
    text-align: center;
    cursor: pointer;
    transition: transform .12s, box-shadow .12s, background-color .2s, color .2s, border-color .2s;
  }
  .card.on {
    background: var(--on-bg); border-color: var(--on-bg); color: var(--on-ink);
    transform: translateY(-4px);
    box-shadow: 0 4px 0 var(--on-edge), 0 12px 18px -8px rgba(0, 0, 0, .45);
  }
  .card:active { transform: translateY(0) scale(.97); box-shadow: none; }
  .name { display: block; font-size: 16px; font-weight: 700; }
  .duration { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card.on .duration { color: inherit; opacity: .8; }
  .icon { display: block; font-size: 40px; line-height: 1; margin-top: 12px; }
  .icon.bump { animation: bump .3s ease-out; }
  @keyframes bump { 40% { transform: scale(1.15); } }

  .bar {
    display: block;
    margin-top: 16px;
    height: 10px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
  }
  .card.on .bar { background: color-mix(in srgb, var(--on-ink) 25%, transparent); }
  .fill { display: block; height: 100%; width: 0%; background: var(--muted); border-radius: inherit; }
  .card.on .fill { background: var(--on-ink); }

  /* Muncul di atas kartu, jadi tidak menimpa teks atau ikon */
  .pop {
    position: absolute; left: 50%; bottom: 100%;
    pointer-events: none; white-space: nowrap;
    font-size: 14px; font-weight: 700; color: var(--wood);
    animation: rise .9s ease-out forwards;
  }
  @keyframes rise {
    from { transform: translate(-50%, 4px); opacity: 0; }
    20% { opacity: 1; }
    to { transform: translate(-50%, -20px); opacity: 0; }
  }
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="Menu">
  <div class="brand">Kebon Kosong</div>
  <button class="nav-item" data-page="pohon"><span>🌳</span><span data-i18n="trees"></span></button>
  <button class="nav-item" data-page="inventory"><span>🎒</span><span data-i18n="inventory"></span></button>
  <button class="nav-item" data-page="settings"><span>⚙️</span><span data-i18n="settings"></span></button>
</nav>

<div class="app">
  <header>
    <h1>Kebon Kosong</h1>
    <button class="menu-btn" id="menu-btn" aria-controls="drawer" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <main id="page-pohon">
  <h2 data-i18n="trees"></h2>
  <div class="cards">
  <button class="card" id="toggle" aria-pressed="false">
    <span class="name" data-i18n="acacia"></span>
    <span class="duration" id="duration"></span>
    <span class="icon">🌳</span>
    <span class="bar"><span class="fill" id="fill"></span></span>
  </button>
  </div>
  </main>

  <main id="page-inventory" hidden>
    <h2 data-i18n="inventory"></h2>
    <ul class="items" id="items"></ul>
    <p class="empty" id="empty" data-i18n="empty"></p>
  </main>

  <main id="page-settings" hidden>
    <h2 data-i18n="settings"></h2>
    <div class="setting">
      <span class="setting-label" data-i18n="theme"></span>
      <div class="segment">
        <button data-theme-choice="light" data-i18n="light"></button>
        <button data-theme-choice="dark" data-i18n="dark"></button>
      </div>
    </div>
    <div class="setting">
      <span class="setting-label" data-i18n="language"></span>
      <div class="segment">
        <button data-lang-choice="id">Indonesia</button>
        <button data-lang-choice="en">English</button>
      </div>
    </div>
  </main>
</div>

<script>
  const CHOP_TIME = 2000; // ms per tebangan
  const SAVE_KEY = 'kebon-kosong';
  const SETTINGS_KEY = 'kebon-kosong-settings';
  try { localStorage.removeItem('idle-penebang-v1'); } catch {} // buang simpanan versi lama

  const TEXT = {
    id: {
      trees: 'Pohon', inventory: 'Inventory', settings: 'Pengaturan',
      acacia: 'Pohon Akasia', seconds: 'detik', acaciaWood: 'Kayu Akasia', empty: 'Belum ada item.',
      theme: 'Tema', light: 'Terang', dark: 'Gelap', language: 'Bahasa',
      openMenu: 'Buka menu',
    },
    en: {
      trees: 'Trees', inventory: 'Inventory', settings: 'Settings',
      acacia: 'Acacia Tree', seconds: 'sec', acaciaWood: 'Acacia Wood', empty: 'No items yet.',
      theme: 'Theme', light: 'Light', dark: 'Dark', language: 'Language',
      openMenu: 'Open menu',
    },
  };

  const state = { acaciaWood: 0, running: false, progress: 0, lastTick: Date.now() };
  const settings = { theme: document.documentElement.dataset.theme, lang: 'id' };

  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (saved) Object.assign(state, saved);
  } catch {}
  if (state.wood) { state.acaciaWood += state.wood; delete state.wood; } // simpanan lama: 'wood' = kayu akasia
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if (saved && TEXT[saved.lang]) settings.lang = saved.lang;
  } catch {}

  const $ = id => document.getElementById(id);
  const fillEl = $('fill'), btn = $('toggle'), iconEl = btn.querySelector('.icon'),
        itemsEl = $('items'), emptyEl = $('empty');
  const t = key => TEXT[settings.lang][key];
  let page = 'pohon';

  // Progres offline: kalau sedang berjalan saat ditutup, hitung tebangan yang terlewat
  if (state.running) {
    const elapsed = Date.now() - state.lastTick + state.progress;
    state.acaciaWood += Math.floor(elapsed / CHOP_TIME);
    state.progress = elapsed % CHOP_TIME;
  }

  function save() {
    state.lastTick = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch {}
  }

  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
  }

  // Semua item yang bisa didapat; key = nama field di state
  const ITEMS = [{ key: 'acaciaWood', icon: '🪵' }];

  function popup() {
    const el = document.createElement('span');
    el.className = 'pop';
    el.textContent = '+1 🪵';
    btn.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
    iconEl.classList.remove('bump');
    void iconEl.offsetWidth; // mulai ulang animasi
    iconEl.classList.add('bump');
  }

  function renderInventory() {
    const owned = ITEMS.filter(it => state[it.key] >= 1);
    const locale = settings.lang === 'id' ? 'id-ID' : 'en-US';
    itemsEl.innerHTML = owned.map(it => {
      const qty = Math.floor(state[it.key]).toLocaleString(locale);
      return `<li class="item" title="${t(it.key)}" aria-label="${t(it.key)}: ${qty}">` +
        `<span class="item-icon" aria-hidden="true">${it.icon}</span><span class="item-qty" aria-hidden="true">${qty}</span></li>`;
    }).join('');
    emptyEl.hidden = owned.length > 0;
  }

  function render() {
    fillEl.style.width = (state.progress / CHOP_TIME * 100) + '%';
    btn.classList.toggle('on', state.running);
    btn.setAttribute('aria-pressed', state.running);
  }

  function applySettings() {
    const root = document.documentElement;
    root.dataset.theme = settings.theme;
    root.lang = settings.lang;
    document.querySelector('meta[name="theme-color"]').content = getComputedStyle(root).getPropertyValue('--bg').trim();
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    $('duration').textContent = (CHOP_TIME / 1000) + ' ' + t('seconds');
    $('menu-btn').setAttribute('aria-label', t('openMenu'));
    document.querySelectorAll('[data-theme-choice]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeChoice === settings.theme));
    document.querySelectorAll('[data-lang-choice]').forEach(b => b.setAttribute('aria-pressed', b.dataset.langChoice === settings.lang));
    renderInventory();
  }

  btn.addEventListener('click', () => {
    state.running = !state.running;
    if (!state.running) state.progress = 0;
    save();
    render();
  });

  let last = performance.now();
  function loop(now) {
    const dt = now - last;
    last = now;
    if (state.running) {
      state.progress += dt;
      if (state.progress >= CHOP_TIME) {
        const chops = Math.floor(state.progress / CHOP_TIME);
        state.acaciaWood += chops;
        state.progress %= CHOP_TIME;
        if (page === 'pohon') popup();
        else renderInventory();
      }
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Menu & halaman
  const PAGES = ['pohon', 'inventory', 'settings'];
  const menuBtn = $('menu-btn'), navItems = document.querySelectorAll('.nav-item');

  function setMenu(open) {
    document.body.classList.toggle('menu-open', open);
    menuBtn.setAttribute('aria-expanded', open);
  }

  function showPage(name) {
    page = PAGES.includes(name) ? name : 'pohon';
    PAGES.forEach(p => { $('page-' + p).hidden = p !== page; });
    navItems.forEach(n => {
      if (n.dataset.page === page) n.setAttribute('aria-current', 'page');
      else n.removeAttribute('aria-current');
    });
    if (page === 'inventory') renderInventory();
  }

  menuBtn.addEventListener('click', () => setMenu(!document.body.classList.contains('menu-open')));
  $('scrim').addEventListener('click', () => setMenu(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
  navItems.forEach(n => n.addEventListener('click', () => {
    location.hash = n.dataset.page;
    setMenu(false);
  }));
  window.addEventListener('hashchange', () => showPage(location.hash.slice(1)));

  document.querySelectorAll('[data-theme-choice]').forEach(b => b.addEventListener('click', () => {
    settings.theme = b.dataset.themeChoice;
    saveSettings();
    applySettings();
  }));
  document.querySelectorAll('[data-lang-choice]').forEach(b => b.addEventListener('click', () => {
    settings.lang = b.dataset.langChoice;
    saveSettings();
    applySettings();
  }));

  applySettings();
  showPage(location.hash.slice(1));

  setInterval(save, 5000);
  document.addEventListener('visibilitychange', save);
  window.addEventListener('pagehide', save);
</script>
</body>
</html>
